name: Build Kernel - SukiSU Ultra

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Kernel defconfig"
        required: true
        default: "a3core_eur_open_defconfig"

      filesystem:
        description: "Filesystem variant"
        required: true
        type: choice
        options:
          - EROFS
          - EXT4
        default: EROFS

      disableCm4Watchdog:
        description: "Disable PM_SYS/CM4 watchdog"
        required: true
        type: boolean
        default: false

      isPermissive:
        description: "Force permissive SELinux"
        required: true
        type: boolean
        default: false

      buildModules:
        description: "Build kernel modules"
        required: true
        type: boolean
        default: true

      buildAnyKernel:
        description: "Build AnyKernel3 flashable ZIP"
        required: true
        type: boolean
        default: true

jobs:
  build:
    name: SukiSU Ultra Kernel Build
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      KERNEL_ROOT: ${{ github.workspace }}

      DEFCONFIG: ${{ inputs.defconfig }}
      FILESYSTEM: ${{ inputs.filesystem }}

      BSP_BUILD_FAMILY: sharkl3
      BSP_BUILD_ANDROID_OS: y

      KBUILD_BUILD_USER: SukiSU-CI
      KBUILD_BUILD_HOST: GitHub-Actions

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      # ============================================================
      # BASIC ENVIRONMENT
      # ============================================================

      - name: Setup environment
        shell: bash
        run: |
          set -eux

          echo "=================================================="
          echo "SUKISU ULTRA BUILD"
          echo "=================================================="

          echo "Repository:"
          git remote -v

          echo "Commit:"
          git rev-parse HEAD

          echo "Branch:"
          git branch --show-current || true

          echo "Kernel:"
          grep -E '^VERSION|^PATCHLEVEL|^SUBLEVEL|^EXTRAVERSION' Makefile | head -n 10 || true

          mkdir -p "$KERNEL_ROOT/out"
          mkdir -p "$KERNEL_ROOT/toolchains"

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            gcc \
            g++ \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libyaml-dev \
            libncurses-dev \
            pkg-config \
            python3 \
            python3-pip \
            python2 \
            git \
            curl \
            wget \
            zip \
            unzip \
            cpio \
            xz-utils \
            zstd \
            lz4 \
            gzip \
            tar \
            device-tree-compiler \
            rsync \
            file \
            ca-certificates

          echo
          echo "=================================================="
          echo "DEPENDENCIES INSTALLED"
          echo "=================================================="

          gcc --version | head -n 1
          make --version | head -n 1 || true

      # ============================================================
      # TOOLCHAIN
      # ============================================================

      - name: Download Clang r383902b
        shell: bash
        run: |
          set -euxo pipefail

          CLANG_DIR="$KERNEL_ROOT/toolchains/clang-r383902b"

          if [ ! -x "$CLANG_DIR/bin/clang" ]; then
            rm -rf "$CLANG_DIR"
            mkdir -p "$CLANG_DIR"

            wget -q \
              "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/0e9e7035bf8ad42437c6156e5950eab13655b26c/clang-r383902b.tar.gz" \
              -O /tmp/clang.tar.gz

            tar -xf /tmp/clang.tar.gz \
              -C "$CLANG_DIR"

            rm -f /tmp/clang.tar.gz
          fi

          echo "$CLANG_DIR/bin" >> "$GITHUB_PATH"

          echo "CLANG_DIR=$CLANG_DIR" >> "$GITHUB_ENV"

      - name: Download GCC 14.3
        shell: bash
        run: |
          set -euxo pipefail

          GCC_DIR="$KERNEL_ROOT/toolchains/gcc-14.3"

          if [ ! -x "$GCC_DIR/bin/aarch64-none-linux-gnu-gcc" ]; then
            rm -rf "$GCC_DIR"
            mkdir -p "$GCC_DIR"

            wget -q \
              "https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-aarch64-none-linux-gnu.tar.xz" \
              -O /tmp/gcc.tar.xz

            tar -xf /tmp/gcc.tar.xz \
              -C "$GCC_DIR" \
              --strip-components=1

            rm -f /tmp/gcc.tar.xz
          fi

          echo "$GCC_DIR/bin" >> "$GITHUB_PATH"

          echo "GCC_DIR=$GCC_DIR" >> "$GITHUB_ENV"

      # ============================================================
      # TOOLCHAIN VARIABLES
      # ============================================================

      - name: Configure toolchain
        shell: bash
        run: |
          set -euxo pipefail

          GCC_DIR="$KERNEL_ROOT/toolchains/gcc-14.3"
          CLANG_DIR="$KERNEL_ROOT/toolchains/clang-r383902b"

          export PATH="$CLANG_DIR/bin:$GCC_DIR/bin:$PATH"

          echo "PATH=$PATH" >> "$GITHUB_ENV"

          echo "CC=clang" >> "$GITHUB_ENV"
          echo "LD=ld.lld" >> "$GITHUB_ENV"
          echo "AR=llvm-ar" >> "$GITHUB_ENV"
          echo "NM=llvm-nm" >> "$GITHUB_ENV"
          echo "OBJCOPY=llvm-objcopy" >> "$GITHUB_ENV"
          echo "OBJDUMP=llvm-objdump" >> "$GITHUB_ENV"
          echo "STRIP=llvm-strip" >> "$GITHUB_ENV"

          echo "CROSS_COMPILE=$GCC_DIR/bin/aarch64-none-linux-gnu-" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE_ARM32=$GCC_DIR/bin/arm-none-linux-gnueabihf-" >> "$GITHUB_ENV"

          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> "$GITHUB_ENV"

          echo
          echo "=================================================="
          echo "TOOLCHAIN"
          echo "=================================================="

          command -v clang
          command -v ld.lld
          command -v llvm-ar
          command -v llvm-nm
          command -v aarch64-none-linux-gnu-gcc

          clang --version | head -n 2
          ld.lld --version | head -n 2
          aarch64-none-linux-gnu-gcc --version | head -n 1

      # ============================================================
      # CLEAN BUILD TREE
      # ============================================================

      - name: Clean kernel build tree
        shell: bash
        run: |
          set -euxo pipefail

          echo "=================================================="
          echo "CLEAN BUILD TREE"
          echo "=================================================="

          rm -rf "$KERNEL_ROOT/out"

          mkdir -p "$KERNEL_ROOT/out"

          # Remove generated files from the source tree only.
          # Do NOT delete source files.
          make mrproper

          mkdir -p "$KERNEL_ROOT/out"

          git status --short

      # ============================================================
      # INTEGRATE SUKISU ULTRA
      # ============================================================

      - name: Integrate SukiSU Ultra builtin
        shell: bash
        run: |
          set -euxo pipefail

          echo "=================================================="
          echo "SUKISU ULTRA INTEGRATION"
          echo "=================================================="

          # Remove old KernelSU implementations.
          rm -rf KernelSU
          rm -rf KernelSU-Next
          rm -rf drivers/kernelsu

          # SukiSU Ultra official builtin integration.
          #
          # builtin is intended for built-in/non-GKI kernels.
          curl -LSs \
            "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" \
            | bash -s builtin

          echo
          echo "SukiSU directory:"
          ls -la drivers/kernelsu

          test -f drivers/kernelsu/Kconfig

          echo
          echo "=================================================="
          echo "SUKISU SOURCE"
          echo "=================================================="

          git -C drivers/kernelsu remote -v || true
          git -C drivers/kernelsu rev-parse HEAD || true
          git -C drivers/kernelsu describe --tags --always || true

      # ============================================================
      # VERIFY SUKISU SOURCE
      # ============================================================

      - name: Verify SukiSU source
        shell: bash
        run: |
          set -euxo pipefail

          echo "=================================================="
          echo "SUKISU SOURCE VERIFICATION"
          echo "=================================================="

          test -d drivers/kernelsu
          test -f drivers/kernelsu/Kconfig

          grep -R "config KSU" \
            drivers/kernelsu/Kconfig \
            drivers/kernelsu 2>/dev/null | head -n 20 || true

          echo
          echo "SukiSU source files:"
          find drivers/kernelsu -maxdepth 2 -type f | head -n 50

      # ============================================================
      # FIX OLD DTC YAML SUPPORT
      # ============================================================

      - name: Fix vendor DTC YAML compatibility
        shell: bash
        run: |
          set -euxo pipefail

          echo "=================================================="
          echo "DTC COMPATIBILITY"
          echo "=================================================="

          if [ -f scripts/dtc/Makefile ]; then
            sed -i '/yamltree.o/d' scripts/dtc/Makefile || true
          fi

          if [ -f scripts/dtc/dtc.c ]; then
            sed -i '/dt_to_yaml/d' scripts/dtc/dtc.c || true
          fi

          grep -n "yaml\|yamltree\|dt_to_yaml" \
            scripts/dtc/Makefile \
            scripts/dtc/dtc.c 2>/dev/null || true

      # ============================================================
      # CONFIGURE DEFCONFIG
      # ============================================================

      - name: Configure kernel
        shell: bash
        run: |
          set -euxo pipefail

          echo "=================================================="
          echo "KERNEL CONFIGURATION"
          echo "=================================================="

          make \
            -C "$KERNEL_ROOT" \
            O="$KERNEL_ROOT/out" \
            ARCH="$ARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CC="$CC" \
            LD="$LD" \
            AR="$AR" \
            NM="$NM" \
            "$DEFCONFIG"

          test -f "$KERNEL_ROOT/out/.config"

      # ============================================================
      # CONFIGURE SUKISU
      # ============================================================

      - name: Enable SukiSU Ultra configuration
        shell: bash
        run: |
          set -euxo pipefail

          echo "=================================================="
          echo "SUKISU CONFIGURATION"
          echo "=================================================="

          test -x scripts/config

          # Core KSU.
          scripts/config \
            --file out/.config \
            -e KSU

          # SukiSU builtin/non-GKI manual hook.
          if grep -q 'config KSU_MANUAL_HOOK' drivers/kernelsu/Kconfig; then
            scripts/config \
              --file out/.config \
              -e KSU_MANUAL_HOOK
          else
            echo "[WARN] KSU_MANUAL_HOOK does not exist in this SukiSU tree"
          fi

          # Required for compatibility/debugging on this old vendor kernel.
          if grep -q 'config KPROBES' kernel/Kconfig* arch/*/Kconfig* 2>/dev/null; then
            scripts/config \
              --file out/.config \
              -e KPROBES || true
          fi

          # Do not force KSU into a module.
          if grep -q 'config KSU' drivers/kernelsu/Kconfig; then
            scripts/config \
              --file out/.config \
              --set-val KSU y || true
          fi

          make \
            -C "$KERNEL_ROOT" \
            O="$KERNEL_ROOT/out" \
            ARCH="$ARCH" \
            olddefconfig

          echo
          echo "=================================================="
          echo "SUKISU CONFIG"
          echo "=================================================="

          grep -E \
            '^CONFIG_KSU=|^CONFIG_KSU_|^# CONFIG_KSU_' \
            out/.config || true

          echo
          echo "=================================================="
          echo "KPROBES CONFIG"
          echo "=================================================="

          grep -E \
            '^CONFIG_KPROBES=|^# CONFIG_KPROBES' \
            out/.config || true

      # ============================================================
      # FILESYSTEM
      # ============================================================

      - name: Configure filesystem
        shell: bash
        run: |
          set -euxo pipefail

          echo "=================================================="
          echo "FILESYSTEM: $FILESYSTEM"
          echo "=================================================="

          case "$FILESYSTEM" in

            EROFS)
              scripts/config --file out/.config -e EROFS_FS || true
              scripts/config --file out/.config -e EROFS_FS_XATTR || true
              scripts/config --file out/.config -e EROFS_FS_POSIX_ACL || true
              scripts/config --file out/.config -e EROFS_FS_SECURITY || true
              scripts/config --file out/.config -e EROFS_FS_ZIP || true
              scripts/config --file out/.config -e EROFS_FS_ARMV8_ACCELERATED_LZ4 || true
              ;;

            EXT4)
              scripts/config --file out/.config -e EXT4_FS || true
              scripts/config --file out/.config -e EXT4_FS_POSIX_ACL || true
              scripts/config --file out/.config -e EXT4_FS_SECURITY || true
              scripts/config --file out/.config -e EXT4_ENCRYPTION || true
              scripts/config --file out/.config -e EXT4_FS_ENCRYPTION || true

              scripts/config --file out/.config -d EROFS_FS || true
              scripts/config --file out/.config -d EROFS_FS_XATTR || true
              scripts/config --file out/.config -d EROFS_FS_POSIX_ACL || true
              scripts/config --file out/.config -d EROFS_FS_SECURITY || true
              scripts/config --file out/.config -d EROFS_FS_ZIP || true
              scripts/config --file out/.config -d EROFS_FS_ARMV8_ACCELERATED_LZ4 || true
              ;;

            *)
              echo "Unknown filesystem: $FILESYSTEM"
              exit 1
              ;;
          esac

          make \
            -C "$KERNEL_ROOT" \
            O="$KERNEL_ROOT/out" \
            ARCH="$ARCH" \
            olddefconfig

          grep -E \
            '^CONFIG_(EROFS|EXT4)|^# CONFIG_(EROFS|EXT4)' \
            out/.config || true

      # ============================================================
      # OPTIONAL WATCHDOG PATCH
      # ============================================================

      - name: Disable CM4 watchdog
        if: ${{ inputs.disableCm4Watchdog == true }}
        shell: bash
        run: |
          set -euxo pipefail

          FILE="drivers/watchdog/sprd_pmic_wdt.c"

          test -f "$FILE"

          python3 - <<'PY'
          from pathlib import Path

          path = Path("drivers/watchdog/sprd_pmic_wdt.c")
          text = path.read_text()

          start = text.find("static bool sprd_pimc_wdt_en(void)")
          end = text.find("static const struct of_device_id", start)

          if start < 0 or end < 0:
              raise SystemExit(
                  "sprd_pimc_wdt_en() could not be located"
              )

          block = text[start:end]

          old = "\treturn true;"
          new = "\treturn false; /* diagnostic: disable PM_SYS/CM4 watchdog */"

          if old not in block:
              raise SystemExit(
                  "Expected return true not found"
              )

          block = block.replace(old, new, 1)

          path.write_text(
              text[:start] +
              block +
              text[end:]
          )
          PY

          echo "Watchdog patch applied."

      # ============================================================
      # OPTIONAL PERMISSIVE SELINUX
      # ============================================================

      - name: Apply permissive SELinux patch
        if: ${{ inputs.isPermissive == true }}
        shell: bash
        run: |
          set -euxo pipefail

          echo "=================================================="
          echo "PERMISSIVE SELINUX"
          echo "=================================================="

          if [ -f security/selinux/hooks.c ]; then
            cp security/selinux/hooks.c /tmp/hooks.c.backup

            python3 - <<'PY'
          from pathlib import Path

          path = Path("security/selinux/hooks.c")
          text = path.read_text()

          replacements = [
              (
                  "return enforcing_enabled ? 0 : -EPERM;",
                  "return 0;"
              )
          ]

          changed = False

          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
                  changed = True

          if changed:
              path.write_text(text)
              print("SELinux permissive patch applied.")
          else:
              print("No known SELinux pattern found.")
              print("Build will continue without automatic SELinux patch.")
          PY
          else
            echo "SELinux hooks source not found."
          fi

      # ============================================================
      # FINAL CONFIG VALIDATION
      # ============================================================

      - name: Validate final kernel config
        shell: bash
        run: |
          set -euxo pipefail

          echo "=================================================="
          echo "FINAL CONFIG VALIDATION"
          echo "=================================================="

          test -f out/.config

          echo
          echo "SUKISU:"
          grep -E \
            '^CONFIG_KSU=|^CONFIG_KSU_MANUAL_HOOK=|^CONFIG_KSU_KPROBES|^CONFIG_KSU_TRACEPOINT|^CONFIG_KSU_SUSFS' \
            out/.config || true

          echo
          echo "HOOK:"
          grep -E \
            '^CONFIG_KPROBES=' \
            out/.config || true

          echo
          echo "FILESYSTEM:"
          grep -E \
            '^CONFIG_EROFS_FS=|^CONFIG_EXT4_FS=' \
            out/.config || true

          if ! grep -q '^CONFIG_KSU=y$' out/.config; then
            echo "[ERROR] CONFIG_KSU=y missing"
            exit 1
          fi

          if grep -q 'config KSU_MANUAL_HOOK' drivers/kernelsu/Kconfig; then
            if ! grep -q '^CONFIG_KSU_MANUAL_HOOK=y$' out/.config; then
              echo "[ERROR] CONFIG_KSU_MANUAL_HOOK=y missing"
              exit 1
            fi
          fi

          echo "[OK] SukiSU configuration validated."

      # ============================================================
      # BUILD KERNEL
      # ============================================================

      - name: Build kernel Image
        shell: bash
        run: |
          set -euxo pipefail

          echo "=================================================="
          echo "BUILD KERNEL"
          echo "=================================================="

          export KBUILD_BUILD_TIMESTAMP="$(date -u '+%a %b %d %T UTC %Y')"

          make \
            -C "$KERNEL_ROOT" \
            O="$KERNEL_ROOT/out" \
            ARCH="$ARCH" \
            CC="$CC" \
            LD="$LD" \
            AR="$AR" \
            NM="$NM" \
            OBJCOPY="$OBJCOPY" \
            OBJDUMP="$OBJDUMP" \
            STRIP="$STRIP" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            BSP_BUILD_FAMILY="$BSP_BUILD_FAMILY" \
            BSP_BUILD_ANDROID_OS="$BSP_BUILD_ANDROID_OS" \
            -j"$(nproc)" \
            Image

          test -s \
            "$KERNEL_ROOT/out/arch/arm64/boot/Image"

          echo
          echo "=================================================="
          echo "KERNEL IMAGE"
          echo "=================================================="

          ls -lh \
            "$KERNEL_ROOT/out/arch/arm64/boot/Image"

          file \
            "$KERNEL_ROOT/out/arch/arm64/boot/Image"

          sha256sum \
            "$KERNEL_ROOT/out/arch/arm64/boot/Image"

      # ============================================================
      # BUILD MODULES
      # ============================================================

      - name: Build kernel modules
        if: ${{ inputs.buildModules == true }}
        shell: bash
        run: |
          set -euxo pipefail

          echo "=================================================="
          echo "BUILD MODULES"
          echo "=================================================="

          make \
            -C "$KERNEL_ROOT" \
            O="$KERNEL_ROOT/out" \
            ARCH="$ARCH" \
            CC="$CC" \
            LD="$LD" \
            AR="$AR" \
            NM="$NM" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            -j"$(nproc)" \
            modules

          echo
          echo "Module count:"
          find "$KERNEL_ROOT/out" \
            -type f \
            -name "*.ko" | wc -l

      # ============================================================
      # BUILD DTBS
      # ============================================================

      - name: Build DTBs and DTBOs
        shell: bash
        run: |
          set -euxo pipefail

          echo "=================================================="
          echo "BUILD DTBS / DTBOS"
          echo "=================================================="

          make \
            -C "$KERNEL_ROOT" \
            O="$KERNEL_ROOT/out" \
            ARCH="$ARCH" \
            CC="$CC" \
            LD="$LD" \
            AR="$AR" \
            NM="$NM" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            BSP_BUILD_FAMILY="$BSP_BUILD_FAMILY" \
            BSP_BUILD_ANDROID_OS="$BSP_BUILD_ANDROID_OS" \
            -j"$(nproc)" \
            dtbs

          mkdir -p "$KERNEL_ROOT/output_artifacts/dtbs"

          if [ -d "$KERNEL_ROOT/out/arch/arm64/boot/dts" ]; then
            find "$KERNEL_ROOT/out/arch/arm64/boot/dts" \
              -type f \
              \( \
                -name "*.dtb" \
                -o \
                -name "*.dtbo" \
              \) \
              -exec cp --parents {} \
              "$KERNEL_ROOT/output_artifacts/dtbs/" \;
          fi

          echo
          echo "=================================================="
          echo "DTB / DTBO"
          echo "=================================================="

          find "$KERNEL_ROOT/output_artifacts/dtbs" \
            -type f | sort || true

          echo
          echo "DTB/DTBO count:"
          find "$KERNEL_ROOT/output_artifacts/dtbs" \
            -type f | wc -l

      # ============================================================
      # COLLECT MODULES
      # ============================================================

      - name: Collect modules
        if: ${{ inputs.buildModules == true }}
        shell: bash
        run: |
          set -euxo pipefail

          MODULE_DIR="$KERNEL_ROOT/output_artifacts/modules"

          mkdir -p "$MODULE_DIR"

          find "$KERNEL_ROOT/out" \
            -type f \
            -name "*.ko" \
            | while read -r ko; do

                rel="${ko#$KERNEL_ROOT/out/}"

                mkdir -p \
                  "$MODULE_DIR/$(dirname "$rel")"

                cp "$ko" \
                  "$MODULE_DIR/$rel"
            done

          echo
          echo "Modules:"
          find "$MODULE_DIR" \
            -type f \
            -name "*.ko" \
            | sort

      # ============================================================
      # SUKISU METADATA
      # ============================================================

      - name: Generate SukiSU metadata
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$KERNEL_ROOT/output_artifacts"

          echo "==================================================" > \
            output_artifacts/sukisu-info.txt

          echo "SUKISU ULTRA" >> \
            output_artifacts/sukisu-info.txt

          echo "==================================================" >> \
            output_artifacts/sukisu-info.txt

          echo "Integration: builtin" >> \
            output_artifacts/sukisu-info.txt

          echo "Repository: SukiSU-Ultra/SukiSU-Ultra" >> \
            output_artifacts/sukisu-info.txt

          if [ -d drivers/kernelsu/.git ]; then
            echo "Commit:" >> output_artifacts/sukisu-info.txt
            git -C drivers/kernelsu rev-parse HEAD \
              >> output_artifacts/sukisu-info.txt || true

            echo "Tag:" >> output_artifacts/sukisu-info.txt
            git -C drivers/kernelsu describe --tags --always \
              >> output_artifacts/sukisu-info.txt || true
          fi

          echo >> output_artifacts/sukisu-info.txt
          echo "KernelSU config:" \
            >> output_artifacts/sukisu-info.txt

          grep -E \
            '^CONFIG_KSU=|^CONFIG_KSU_' \
            out/.config \
            >> output_artifacts/sukisu-info.txt \
            || true

      # ============================================================
      # KERNEL METADATA
      # ============================================================

      - name: Collect kernel metadata
        shell: bash
        run: |
          set -euxo pipefail

          ART="$KERNEL_ROOT/output_artifacts"

          mkdir -p "$ART"

          cp \
            "$KERNEL_ROOT/out/arch/arm64/boot/Image" \
            "$ART/Image"

          cp \
            "$KERNEL_ROOT/out/.config" \
            "$ART/kernel.config"

          if [ -f "$KERNEL_ROOT/out/System.map" ]; then
            cp "$KERNEL_ROOT/out/System.map" "$ART/System.map"
          fi

          if [ -f "$KERNEL_ROOT/out/Module.symvers" ]; then
            cp "$KERNEL_ROOT/out/Module.symvers" \
              "$ART/Module.symvers"
          fi

          if [ -f "$KERNEL_ROOT/out/include/config/kernel.release" ]; then
            cp \
              "$KERNEL_ROOT/out/include/config/kernel.release" \
              "$ART/kernel.release"
          fi

          echo
          echo "=================================================="
          echo "ARTIFACT CONTENT"
          echo "=================================================="

          find "$ART" \
            -type f \
            -exec ls -lh {} \;

      # ============================================================
      # SHA256
      # ============================================================

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL_ROOT/output_artifacts"

          find . \
            -type f \
            ! -name "SHA256SUMS" \
            -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > SHA256SUMS

          echo
          cat SHA256SUMS

      # ============================================================
      # ANYKERNEL3
      # ============================================================

      - name: Build AnyKernel3
        if: ${{ inputs.buildAnyKernel == true }}
        shell: bash
        run: |
          set -euxo pipefail

          echo "=================================================="
          echo "ANYKERNEL3"
          echo "=================================================="

          rm -rf "$KERNEL_ROOT/AnyKernel3"

          git clone \
            --depth 1 \
            https://github.com/osm0sis/AnyKernel3.git \
            "$KERNEL_ROOT/AnyKernel3"

          cp \
            "$KERNEL_ROOT/out/arch/arm64/boot/Image" \
            "$KERNEL_ROOT/AnyKernel3/Image"

          cd "$KERNEL_ROOT/AnyKernel3"

          if [ -f anykernel.sh ]; then

            sed -i \
              's/do.devicecheck=1/do.devicecheck=0/g' \
              anykernel.sh || true

            sed -i \
              's/IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=0;/g' \
              anykernel.sh || true

          fi

          rm -rf .git .github

          ZIP_NAME="A032F-SukiSU-Ultra-${FILESYSTEM}.zip"

          zip -r9 \
            "../$ZIP_NAME" \
            . \
            -x "*.git*" \
            -x ".github/*"

          cd "$KERNEL_ROOT"

          cp \
            "$KERNEL_ROOT/$ZIP_NAME" \
            "$KERNEL_ROOT/output_artifacts/$ZIP_NAME"

          ls -lh \
            "$KERNEL_ROOT/output_artifacts/$ZIP_NAME"

      # ============================================================
      # FINAL VERIFICATION
      # ============================================================

      - name: Final verification
        shell: bash
        run: |
          set -euxo pipefail

          echo "=================================================="
          echo "FINAL VERIFICATION"
          echo "=================================================="

          test -s output_artifacts/Image
          test -s output_artifacts/kernel.config
          test -s output_artifacts/SHA256SUMS

          if ! grep -q '^CONFIG_KSU=y$' \
              output_artifacts/kernel.config; then
            echo "[ERROR] KernelSU/SukiSU is not enabled."
            exit 1
          fi

          if grep -q \
              'config KSU_MANUAL_HOOK' \
              drivers/kernelsu/Kconfig; then

            if ! grep -q \
                '^CONFIG_KSU_MANUAL_HOOK=y$' \
                output_artifacts/kernel.config; then

              echo "[ERROR] KSU_MANUAL_HOOK is missing."
              exit 1
            fi
          fi

          echo "[OK] Kernel Image"
          echo "[OK] SukiSU CONFIG_KSU"
          echo "[OK] Manual hook configuration"
          echo "[OK] SHA256SUMS"

          echo
          echo "=================================================="
          echo "FINAL ARTIFACTS"
          echo "=================================================="

          find output_artifacts \
            -type f \
            -exec ls -lh {} \;

      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================

      - name: Upload complete kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Ultra-${{ inputs.filesystem }}
          path: |
            ${{ github.workspace }}/output_artifacts
          retention-days: 14
