name: Build SukiSU Ultra - SharkL3 4.14

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-sukisu:

    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout Kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # BASIC SOURCE INFO
      # ============================================================
      - name: Source Information
        shell: bash
        run: |
          set -euxo pipefail

          cd "${GITHUB_WORKSPACE}"

          echo "=================================================="
          echo "SOURCE INFORMATION"
          echo "=================================================="

          echo "Remote:"
          git remote -v || true

          echo ""
          echo "Commit:"
          git rev-parse HEAD

          echo ""
          echo "Branch:"
          git branch --show-current || true

          echo ""
          echo "Kernel version:"
          make kernelversion || true

      # ============================================================
      # BASH
      # ============================================================
      - name: Setup Bash
        shell: bash
        run: |
          set -euxo pipefail

          sudo ln -sf /bin/bash /bin/sh

          echo "Shell:"
          bash --version | head -n 2

      # ============================================================
      # APT CACHE
      # ============================================================
      - name: Cache APT
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: sukisu-apt-ubuntu22-v5
          restore-keys: |
            sukisu-apt-ubuntu22-

      # ============================================================
      # TOOLCHAIN CACHE
      # ============================================================
      - name: Cache Toolchains
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/toolchain_download
          key: sukisu-toolchain-clang-r383902b-gcc14-v5
          restore-keys: |
            sukisu-toolchain-

      # ============================================================
      # DEPENDENCIES
      # ============================================================
      - name: Install Dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            libyaml-dev \
            pkg-config \
            ccache \
            python3 \
            python3-minimal \
            python2 \
            git \
            curl \
            wget \
            zip \
            unzip \
            cpio \
            gzip \
            bzip2 \
            xz-utils \
            tar \
            rsync \
            file \
            device-tree-compiler \
            gcc-aarch64-linux-gnu \
            libc6-dev \
            clang \
            lld

          echo "=================================================="
          echo "DEPENDENCIES INSTALLED"
          echo "=================================================="

          echo "GCC:"
          gcc --version | head -n 1

          echo ""
          echo "CLANG:"
          clang --version | head -n 1

          echo ""
          echo "LLD:"
          ld.lld --version | head -n 1

          echo ""
          echo "MAKE:"
          make --version | head -n 1

      # ============================================================
      # CLEAN SOURCE TREE
      # ============================================================
      - name: Clean Source Tree
        shell: bash
        run: |
          set -euxo pipefail

          cd "${GITHUB_WORKSPACE}"

          echo "=================================================="
          echo "CLEAN SOURCE TREE"
          echo "=================================================="

          rm -rf "${GITHUB_WORKSPACE}/out"

          # Clean generated kernel files.
          make mrproper

          # Explicitly remove generated configuration state
          # from the source tree.
          rm -f "${GITHUB_WORKSPACE}/.config"
          rm -f "${GITHUB_WORKSPACE}/.config.old"
          rm -rf "${GITHUB_WORKSPACE}/include/config"

          mkdir -p "${GITHUB_WORKSPACE}/out"

          echo ""
          echo "Source checks:"

          test ! -e "${GITHUB_WORKSPACE}/.config"
          test ! -e "${GITHUB_WORKSPACE}/.config.old"
          test ! -e "${GITHUB_WORKSPACE}/include/config"

          echo "[OK] Source tree clean."

      # ============================================================
      # TOOLCHAIN
      # ============================================================
      - name: Setup Toolchain
        shell: bash
        run: |
          set -euxo pipefail

          ROOT="${GITHUB_WORKSPACE}"
          TC="${ROOT}/toolchain_download"

          CLANG_DIR="${TC}/clang-r383902b"
          GCC_DIR="${TC}/gcc-14.3"

          mkdir -p "${CLANG_DIR}"
          mkdir -p "${GCC_DIR}"

          # --------------------------------------------------------
          # CLANG R383902B
          # --------------------------------------------------------
          if [ ! -x "${CLANG_DIR}/bin/clang" ]; then

            echo "[+] Downloading Clang r383902b..."

            rm -f /tmp/clang.tar.gz

            wget \
              --show-progress \
              -O /tmp/clang.tar.gz \
              "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/0e9e7035bf8ad42437c6156e5950eab13655b26c/clang-r383902b.tar.gz"

            test -s /tmp/clang.tar.gz

            tar \
              -xf /tmp/clang.tar.gz \
              -C "${CLANG_DIR}"

            rm -f /tmp/clang.tar.gz

          else

            echo "[=] Clang already cached."

          fi

          # --------------------------------------------------------
          # GCC 14.3
          # --------------------------------------------------------
          if [ ! -x "${GCC_DIR}/bin/aarch64-none-linux-gnu-gcc" ]; then

            echo "[+] Downloading GCC 14.3..."

            rm -f /tmp/gcc.tar.xz

            wget \
              --show-progress \
              -O /tmp/gcc.tar.xz \
              "https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-aarch64-none-linux-gnu.tar.xz"

            test -s /tmp/gcc.tar.xz

            tar \
              -xf /tmp/gcc.tar.xz \
              -C "${GCC_DIR}" \
              --strip-components=1

            rm -f /tmp/gcc.tar.xz

          else

            echo "[=] GCC 14.3 already cached."

          fi

          # --------------------------------------------------------
          # VERIFY
          # --------------------------------------------------------
          test -x "${CLANG_DIR}/bin/clang"
          test -x "${CLANG_DIR}/bin/ld.lld"
          test -x "${CLANG_DIR}/bin/llvm-ar"
          test -x "${CLANG_DIR}/bin/llvm-nm"
          test -x "${CLANG_DIR}/bin/llvm-objcopy"
          test -x "${CLANG_DIR}/bin/llvm-objdump"
          test -x "${CLANG_DIR}/bin/llvm-strip"

          test -x "${GCC_DIR}/bin/aarch64-none-linux-gnu-gcc"

          # ARM32 compiler may not exist in this downloaded
          # AArch64-only toolchain. Do not fail because of it.
          ARM32="${GCC_DIR}/bin/arm-none-linux-gnueabihf-"

          # --------------------------------------------------------
          # PATH
          # --------------------------------------------------------
          echo "${CLANG_DIR}/bin" >> "${GITHUB_PATH}"
          echo "${GCC_DIR}/bin" >> "${GITHUB_PATH}"

          # --------------------------------------------------------
          # ENVIRONMENT
          # --------------------------------------------------------
          {
            echo "ARCH=arm64"
            echo "SUBARCH=arm64"

            echo "CLANG_BIN=${CLANG_DIR}/bin"
            echo "GCC_BIN=${GCC_DIR}/bin"

            echo "CC=${CLANG_DIR}/bin/clang"
            echo "HOSTCC=${CLANG_DIR}/bin/clang"

            echo "LD=${CLANG_DIR}/bin/ld.lld"
            echo "AR=${CLANG_DIR}/bin/llvm-ar"
            echo "NM=${CLANG_DIR}/bin/llvm-nm"

            echo "OBJCOPY=${CLANG_DIR}/bin/llvm-objcopy"
            echo "OBJDUMP=${CLANG_DIR}/bin/llvm-objdump"
            echo "STRIP=${CLANG_DIR}/bin/llvm-strip"
            echo "READELF=${CLANG_DIR}/bin/llvm-readelf"

            echo "LLVM=1"
            echo "LLVM_IAS=1"

            echo "CLANG_TRIPLE=aarch64-linux-gnu-"

            echo "CROSS_COMPILE=${GCC_DIR}/bin/aarch64-none-linux-gnu-"

            if [ -x "${GCC_DIR}/bin/arm-none-linux-gnueabihf-gcc" ]; then
              echo "CROSS_COMPILE_ARM32=${GCC_DIR}/bin/arm-none-linux-gnueabihf-"
            else
              echo "CROSS_COMPILE_ARM32="
            fi

            echo "BSP_BUILD_FAMILY=sharkl3"
            echo "BSP_BUILD_ANDROID_OS=y"

            echo "DEFCONFIG=a3core_eur_open_defconfig"

            echo "KBUILD_BUILD_USER=SukiSU"
            echo "KBUILD_BUILD_HOST=SharkL3"
            echo "KBUILD_BUILD_TIMESTAMP=$(date -u '+%a %b %d %T UTC %Y')"

          } >> "${GITHUB_ENV}"

          echo ""
          echo "=================================================="
          echo "CUSTOM TOOLCHAIN"
          echo "=================================================="

          "${CLANG_DIR}/bin/clang" --version | head -n 1
          "${CLANG_DIR}/bin/ld.lld" --version | head -n 1
          "${GCC_DIR}/bin/aarch64-none-linux-gnu-gcc" --version | head -n 1

      # ============================================================
      # VERIFY TOOLCHAIN
      # ============================================================
      - name: Verify Toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "=================================================="
          echo "TOOLCHAIN VERIFICATION"
          echo "=================================================="

          echo "CC=${CC}"
          echo "LD=${LD}"
          echo "AR=${AR}"
          echo "NM=${NM}"
          echo "CROSS_COMPILE=${CROSS_COMPILE}"

          test -x "${CC}"
          test -x "${LD}"
          test -x "${AR}"
          test -x "${NM}"

          echo ""
          echo "LD:"
          "${LD}" --version | head -n 1

          echo ""
          echo "[OK] Toolchain ready."

      # ============================================================
      # INTEGRATE SUKISU ULTRA
      # ============================================================
      - name: Integrate SukiSU Ultra
        shell: bash
        run: |
          set -euxo pipefail

          cd "${GITHUB_WORKSPACE}"

          echo "=================================================="
          echo "SUKISU ULTRA INTEGRATION"
          echo "=================================================="

          if [ ! -d "${GITHUB_WORKSPACE}/drivers/kernelsu" ]; then

            echo "[+] Installing SukiSU Ultra..."

            curl -LSs \
              "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" \
              | bash -s builtin

          else

            echo "[=] drivers/kernelsu already exists."

          fi

          if [ ! -d "${GITHUB_WORKSPACE}/drivers/kernelsu" ]; then
            echo "[ERROR] drivers/kernelsu does not exist."
            exit 1
          fi

          echo "[OK] drivers/kernelsu exists."

          echo ""
          echo "SukiSU tree:"
          find "${GITHUB_WORKSPACE}/drivers/kernelsu" \
            -maxdepth 2 \
            -type f \
            | sort \
            | head -n 100

          # --------------------------------------------------------
          # IMPORTANT
          #
          # SukiSU setup must not leave generated Kbuild state
          # in source tree.
          # --------------------------------------------------------
          rm -f "${GITHUB_WORKSPACE}/.config"
          rm -f "${GITHUB_WORKSPACE}/.config.old"
          rm -rf "${GITHUB_WORKSPACE}/include/config"

          echo ""
          echo "[OK] Source generated-state removed after SukiSU integration."

      # ============================================================
      # SOURCE TREE GUARD
      # ============================================================
      - name: Source Tree Guard
        shell: bash
        run: |
          set -euo pipefail

          cd "${GITHUB_WORKSPACE}"

          echo "=================================================="
          echo "SOURCE TREE GUARD"
          echo "=================================================="

          # These are forbidden before an O=out build.
          rm -f "${GITHUB_WORKSPACE}/.config"
          rm -f "${GITHUB_WORKSPACE}/.config.old"
          rm -rf "${GITHUB_WORKSPACE}/include/config"

          if [ -e "${GITHUB_WORKSPACE}/.config" ]; then
            echo "[ERROR] Source .config exists."
            exit 1
          fi

          if [ -e "${GITHUB_WORKSPACE}/include/config" ]; then
            echo "[ERROR] Source include/config exists."
            exit 1
          fi

          echo "[OK] Source tree is clean for O=out."

      # ============================================================
      # PREPARE DEFCONFIG
      # ============================================================
      - name: Prepare Defconfig
        shell: bash
        run: |
          set -euxo pipefail

          cd "${GITHUB_WORKSPACE}"

          echo "=================================================="
          echo "PREPARE DEFCONFIG"
          echo "=================================================="

          rm -rf "${GITHUB_WORKSPACE}/out"

          mkdir -p "${GITHUB_WORKSPACE}/out"

          # Explicitly guarantee clean source state.
          rm -f "${GITHUB_WORKSPACE}/.config"
          rm -f "${GITHUB_WORKSPACE}/.config.old"
          rm -rf "${GITHUB_WORKSPACE}/include/config"

          make \
            O="${GITHUB_WORKSPACE}/out" \
            ARCH="${ARCH}" \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            CROSS_COMPILE_ARM32="${CROSS_COMPILE_ARM32}" \
            CLANG_TRIPLE="${CLANG_TRIPLE}" \
            CC="${CC}" \
            HOSTCC="${HOSTCC}" \
            LD="${LD}" \
            AR="${AR}" \
            NM="${NM}" \
            OBJCOPY="${OBJCOPY}" \
            OBJDUMP="${OBJDUMP}" \
            STRIP="${STRIP}" \
            LLVM="${LLVM}" \
            LLVM_IAS="${LLVM_IAS}" \
            BSP_BUILD_FAMILY="${BSP_BUILD_FAMILY}" \
            BSP_BUILD_ANDROID_OS="${BSP_BUILD_ANDROID_OS}" \
            "${DEFCONFIG}"

          if [ ! -f "${GITHUB_WORKSPACE}/out/.config" ]; then
            echo "[ERROR] out/.config was not generated."
            exit 1
          fi

          echo ""
          echo "[OK] out/.config generated."

          # --------------------------------------------------------
          # Check source tree immediately.
          # --------------------------------------------------------
          if [ -f "${GITHUB_WORKSPACE}/.config" ]; then
            echo "[ERROR] Kbuild generated .config in source tree."
            exit 1
          fi

          if [ -d "${GITHUB_WORKSPACE}/include/config" ]; then
            echo "[ERROR] Kbuild generated include/config in source tree."
            exit 1
          fi

          echo "[OK] Source tree remains clean."

      # ============================================================
      # CONFIGURE SUKISU
      # ============================================================
      - name: Configure SukiSU
        shell: bash
        run: |
          set -euxo pipefail

          cd "${GITHUB_WORKSPACE}"

          CONFIG="${GITHUB_WORKSPACE}/out/.config"

          echo "=================================================="
          echo "CONFIGURE SUKISU"
          echo "=================================================="

          # KSU core.
          ./scripts/config \
            --file "${CONFIG}" \
            --enable CONFIG_KSU

          # KPROBES.
          ./scripts/config \
            --file "${CONFIG}" \
            --enable CONFIG_KPROBES

          # SukiSU KPROBE hook.
          if grep -q "CONFIG_KSU_KPROBES_KSUD" "${CONFIG}" || \
             grep -q "KSU_KPROBES_KSUD" drivers/kernelsu/Kconfig 2>/dev/null; then

            ./scripts/config \
              --file "${CONFIG}" \
              --enable CONFIG_KSU_KPROBES_KSUD \
              || true

          fi

          # Existing KSU options, only if present in this tree.
          if grep -q "CONFIG_KSU_LSM_SECURITY_HOOKS" "${CONFIG}"; then
            ./scripts/config \
              --file "${CONFIG}" \
              --enable CONFIG_KSU_LSM_SECURITY_HOOKS \
              || true
          fi

          if grep -q "CONFIG_KSU_FEATURE_SULOG" "${CONFIG}"; then
            ./scripts/config \
              --file "${CONFIG}" \
              --enable CONFIG_KSU_FEATURE_SULOG \
              || true
          fi

          if grep -q "CONFIG_KSU_FEATURE_ADBROOT" "${CONFIG}"; then
            ./scripts/config \
              --file "${CONFIG}" \
              --enable CONFIG_KSU_FEATURE_ADBROOT \
              || true
          fi

          # Do NOT force MANUAL_HOOK.
          # This kernel tree uses KPROBE hook instead.

          # --------------------------------------------------------
          # Resolve dependencies.
          # --------------------------------------------------------
          make \
            O="${GITHUB_WORKSPACE}/out" \
            ARCH="${ARCH}" \
            olddefconfig

          echo ""
          echo "=================================================="
          echo "FINAL KSU CONFIG"
          echo "=================================================="

          grep -nE \
            "^CONFIG_KSU|^# CONFIG_KSU" \
            "${CONFIG}" \
            || true

          echo ""
          echo "KPROBES:"

          grep -nE \
            "^CONFIG_KPROBES|^# CONFIG_KPROBES" \
            "${CONFIG}" \
            || true

      # ============================================================
      # VERIFY SUKISU
      # ============================================================
      - name: Verify SukiSU
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="${GITHUB_WORKSPACE}/out/.config"

          echo "=================================================="
          echo "SUKISU VERIFICATION"
          echo "=================================================="

          test -d "${GITHUB_WORKSPACE}/drivers/kernelsu"

          echo "[OK] drivers/kernelsu exists."

          echo ""
          echo "KSU CONFIG:"

          grep -nE \
            "^CONFIG_KSU|^# CONFIG_KSU" \
            "${CONFIG}" \
            || true

          echo ""
          echo "HOOK CONFIG:"

          grep -nE \
            "CONFIG_KPROBES|CONFIG_KSU_KPROBES_KSUD|CONFIG_KSU_MANUAL_HOOK|CONFIG_KSU_TRACEPOINT_HOOK" \
            "${CONFIG}" \
            || true

          # --------------------------------------------------------
          # Required core.
          # --------------------------------------------------------
          if ! grep -q "^CONFIG_KSU=y$" "${CONFIG}"; then
            echo "[ERROR] CONFIG_KSU=y is missing."
            exit 1
          fi

          echo "[OK] CONFIG_KSU=y"

          # --------------------------------------------------------
          # KPROBES.
          # --------------------------------------------------------
          if ! grep -q "^CONFIG_KPROBES=y$" "${CONFIG}"; then
            echo "[ERROR] CONFIG_KPROBES=y is missing."
            exit 1
          fi

          echo "[OK] CONFIG_KPROBES=y"

          # --------------------------------------------------------
          # KPROBE KSU hook.
          # --------------------------------------------------------
          if grep -q "^CONFIG_KSU_KPROBES_KSUD=y$" "${CONFIG}"; then
            echo "[OK] CONFIG_KSU_KPROBES_KSUD=y"
          else
            echo "[INFO] CONFIG_KSU_KPROBES_KSUD is not present in this tree."
          fi

          echo ""
          echo "[INFO] CONFIG_KSU_MANUAL_HOOK is NOT forced."
          echo "[INFO] This build uses the KPROBES path."

          echo ""
          echo "[OK] SukiSU configuration verified."

      # ============================================================
      # BUILD IMAGE
      # ============================================================
      - name: Build Kernel Image
        shell: bash
        run: |
          set -euxo pipefail

          cd "${GITHUB_WORKSPACE}"

          export PATH="${CLANG_BIN}:${GCC_BIN}:${PATH}"

          echo "=================================================="
          echo "BUILD KERNEL IMAGE"
          echo "=================================================="

          # Keep source tree clean.
          rm -f "${GITHUB_WORKSPACE}/.config"
          rm -f "${GITHUB_WORKSPACE}/.config.old"
          rm -rf "${GITHUB_WORKSPACE}/include/config"

          make \
            -C "${GITHUB_WORKSPACE}" \
            O="${GITHUB_WORKSPACE}/out" \
            -j"$(nproc)" \
            ARCH="${ARCH}" \
            CC="${CC}" \
            HOSTCC="${HOSTCC}" \
            LD="${LD}" \
            AR="${AR}" \
            NM="${NM}" \
            OBJCOPY="${OBJCOPY}" \
            OBJDUMP="${OBJDUMP}" \
            STRIP="${STRIP}" \
            READELF="${READELF}" \
            LLVM="${LLVM}" \
            LLVM_IAS="${LLVM_IAS}" \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            CROSS_COMPILE_ARM32="${CROSS_COMPILE_ARM32}" \
            CLANG_TRIPLE="${CLANG_TRIPLE}" \
            BSP_BUILD_FAMILY="${BSP_BUILD_FAMILY}" \
            BSP_BUILD_ANDROID_OS="${BSP_BUILD_ANDROID_OS}" \
            Image

          test -f "${GITHUB_WORKSPACE}/out/arch/arm64/boot/Image"

          echo ""
          echo "[OK] Image generated."

          ls -lh \
            "${GITHUB_WORKSPACE}/out/arch/arm64/boot/Image"

      # ============================================================
      # BUILD MODULES
      # ============================================================
      - name: Build Kernel Modules
        shell: bash
        run: |
          set -euxo pipefail

          cd "${GITHUB_WORKSPACE}"

          export PATH="${CLANG_BIN}:${GCC_BIN}:${PATH}"

          echo "=================================================="
          echo "BUILD MODULES"
          echo "=================================================="

          rm -f "${GITHUB_WORKSPACE}/.config"
          rm -f "${GITHUB_WORKSPACE}/.config.old"
          rm -rf "${GITHUB_WORKSPACE}/include/config"

          make \
            -C "${GITHUB_WORKSPACE}" \
            O="${GITHUB_WORKSPACE}/out" \
            -j"$(nproc)" \
            ARCH="${ARCH}" \
            CC="${CC}" \
            HOSTCC="${HOSTCC}" \
            LD="${LD}" \
            AR="${AR}" \
            NM="${NM}" \
            OBJCOPY="${OBJCOPY}" \
            OBJDUMP="${OBJDUMP}" \
            STRIP="${STRIP}" \
            READELF="${READELF}" \
            LLVM="${LLVM}" \
            LLVM_IAS="${LLVM_IAS}" \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            CROSS_COMPILE_ARM32="${CROSS_COMPILE_ARM32}" \
            CLANG_TRIPLE="${CLANG_TRIPLE}" \
            BSP_BUILD_FAMILY="${BSP_BUILD_FAMILY}" \
            BSP_BUILD_ANDROID_OS="${BSP_BUILD_ANDROID_OS}" \
            modules

          echo ""
          echo "Module count:"

          find "${GITHUB_WORKSPACE}/out" \
            -type f \
            -name "*.ko" \
            | wc -l

      # ============================================================
      # BUILD DTBS
      # ============================================================
      - name: Build DTBs
        shell: bash
        run: |
          set -euxo pipefail

          cd "${GITHUB_WORKSPACE}"

          export PATH="${CLANG_BIN}:${GCC_BIN}:${PATH}"

          echo "=================================================="
          echo "BUILD DTBS"
          echo "=================================================="

          rm -f "${GITHUB_WORKSPACE}/.config"
          rm -f "${GITHUB_WORKSPACE}/.config.old"
          rm -rf "${GITHUB_WORKSPACE}/include/config"

          make \
            -C "${GITHUB_WORKSPACE}" \
            O="${GITHUB_WORKSPACE}/out" \
            -j"$(nproc)" \
            ARCH="${ARCH}" \
            CC="${CC}" \
            HOSTCC="${HOSTCC}" \
            LD="${LD}" \
            AR="${AR}" \
            NM="${NM}" \
            OBJCOPY="${OBJCOPY}" \
            OBJDUMP="${OBJDUMP}" \
            STRIP="${STRIP}" \
            READELF="${READELF}" \
            LLVM="${LLVM}" \
            LLVM_IAS="${LLVM_IAS}" \
            CROSS_COMPILE="${CROSS_COMPILE}" \
            CROSS_COMPILE_ARM32="${CROSS_COMPILE_ARM32}" \
            CLANG_TRIPLE="${CLANG_TRIPLE}" \
            BSP_BUILD_FAMILY="${BSP_BUILD_FAMILY}" \
            BSP_BUILD_ANDROID_OS="${BSP_BUILD_ANDROID_OS}" \
            dtbs

          DTB_COUNT=$(
            find "${GITHUB_WORKSPACE}/out/arch/arm64/boot/dts" \
              -type f \
              \( -name "*.dtb" -o -name "*.dtbo" \) \
              2>/dev/null \
              | wc -l
          )

          echo ""
          echo "DTB/DTBO count: ${DTB_COUNT}"

      # ============================================================
      # FINAL VERIFICATION
      # ============================================================
      - name: Final Verification
        shell: bash
        run: |
          set -euo pipefail

          OUT="${GITHUB_WORKSPACE}/out"

          echo "=================================================="
          echo "FINAL BUILD VERIFICATION"
          echo "=================================================="

          # Image.
          if [ ! -f "${OUT}/arch/arm64/boot/Image" ]; then
            echo "[ERROR] Image missing."
            exit 1
          fi

          echo "[OK] Image exists."

          echo ""
          ls -lh "${OUT}/arch/arm64/boot/Image"

          echo ""
          echo "File type:"

          file "${OUT}/arch/arm64/boot/Image"

          echo ""
          echo "SHA256:"

          sha256sum "${OUT}/arch/arm64/boot/Image"

          # DTBs.
          echo ""
          echo "=================================================="
          echo "DTB / DTBO"
          echo "=================================================="

          DTB_COUNT=$(
            find "${OUT}/arch/arm64/boot/dts" \
              -type f \
              \( -name "*.dtb" -o -name "*.dtbo" \) \
              2>/dev/null \
              | wc -l
          )

          echo "DTB/DTBO count: ${DTB_COUNT}"

          # Config.
          echo ""
          echo "=================================================="
          echo "SUKISU CONFIG"
          echo "=================================================="

          grep -nE \
            "^CONFIG_KSU=|^CONFIG_KPROBES=|^CONFIG_KSU_KPROBES_KSUD=|^CONFIG_KSU_LSM_SECURITY_HOOKS=|^CONFIG_KSU_FEATURE_SULOG=|^CONFIG_KSU_FEATURE_ADBROOT=" \
            "${OUT}/.config" \
            || true

      # ============================================================
      # COLLECT ARTIFACTS
      # ============================================================
      - name: Collect Artifacts
        shell: bash
        run: |
          set -euo pipefail

          OUT="${GITHUB_WORKSPACE}/out"
          ART="${GITHUB_WORKSPACE}/output_artifacts"

          rm -rf "${ART}"

          mkdir -p "${ART}"
          mkdir -p "${ART}/dtbs"
          mkdir -p "${ART}/modules"
          mkdir -p "${ART}/sukisu"

          # --------------------------------------------------------
          # IMAGE
          # --------------------------------------------------------
          cp \
            "${OUT}/arch/arm64/boot/Image" \
            "${ART}/Image"

          # --------------------------------------------------------
          # CONFIG
          # --------------------------------------------------------
          cp \
            "${OUT}/.config" \
            "${ART}/kernel.config"

          # --------------------------------------------------------
          # SYSTEM MAP
          # --------------------------------------------------------
          if [ -f "${OUT}/System.map" ]; then
            cp "${OUT}/System.map" "${ART}/System.map"
          fi

          # --------------------------------------------------------
          # MODULE SYMVERS
          # --------------------------------------------------------
          if [ -f "${OUT}/Module.symvers" ]; then
            cp "${OUT}/Module.symvers" "${ART}/Module.symvers"
          fi

          # --------------------------------------------------------
          # KERNEL RELEASE
          # --------------------------------------------------------
          if [ -f "${OUT}/include/config/kernel.release" ]; then
            cp \
              "${OUT}/include/config/kernel.release" \
              "${ART}/kernel.release"
          fi

          # --------------------------------------------------------
          # DTBS
          # --------------------------------------------------------
          if [ -d "${OUT}/arch/arm64/boot/dts" ]; then

            find "${OUT}/arch/arm64/boot/dts" \
              -type f \
              \( -name "*.dtb" -o -name "*.dtbo" \) \
              -exec cp --parents {} "${ART}/dtbs/" \;

          fi

          # --------------------------------------------------------
          # MODULES
          # --------------------------------------------------------
          find "${OUT}" \
            -type f \
            -name "*.ko" \
            -print0 |
          while IFS= read -r -d '' ko; do

            rel="${ko#${OUT}/}"

            mkdir -p \
              "${ART}/modules/$(dirname "${rel}")"

            cp \
              "${ko}" \
              "${ART}/modules/${rel}"

          done

          # --------------------------------------------------------
          # SUKISU INFO
          # --------------------------------------------------------
          echo "SukiSU Ultra" \
            > "${ART}/sukisu/version"

          echo "KPROBES" \
            > "${ART}/sukisu/hook"

          if [ -d "${GITHUB_WORKSPACE}/drivers/kernelsu/.git" ]; then

            git \
              -C "${GITHUB_WORKSPACE}/drivers/kernelsu" \
              rev-parse HEAD \
              > "${ART}/sukisu/commit"

          else

            echo "builtin" \
              > "${ART}/sukisu/commit"

          fi

          grep -E \
            "^CONFIG_KSU=|^CONFIG_KPROBES=|^CONFIG_KSU_KPROBES_KSUD=|^CONFIG_KSU_LSM_SECURITY_HOOKS=|^CONFIG_KSU_FEATURE_SULOG=|^CONFIG_KSU_FEATURE_ADBROOT=" \
            "${OUT}/.config" \
            > "${ART}/sukisu/config" \
            || true

          # --------------------------------------------------------
          # DTB COUNT
          # --------------------------------------------------------
          find "${OUT}/arch/arm64/boot/dts" \
            -type f \
            \( -name "*.dtb" -o -name "*.dtbo" \) \
            2>/dev/null \
            | wc -l \
            > "${ART}/dtb.count"

          # --------------------------------------------------------
          # SHA256
          # --------------------------------------------------------
          (
            cd "${ART}"

            find . \
              -type f \
              ! -name "SHA256SUMS" \
              -print0 |
            sort -z |
            xargs -0 sha256sum \
              > SHA256SUMS
          )

          echo ""
          echo "=================================================="
          echo "ARTIFACT LIST"
          echo "=================================================="

          find "${ART}" \
            -type f \
            -printf "%P\n" \
            | sort

      # ============================================================
      # UPLOAD
      # ============================================================
      - name: Upload SukiSU Kernel
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Ultra-SharkL3-4.14
          path: output_artifacts/
          if-no-files-found: error
          retention-days: 14
