name: Build SukiSU Ultra - SharkL3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-sukisu:

    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout Kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # BASIC INFORMATION
      # ============================================================
      - name: Source Information
        shell: bash
        run: |
          set -euxo pipefail
          cd "${GITHUB_WORKSPACE}"
          
          echo "=================================================="
          echo "SOURCE INFORMATION"
          echo "=================================================="
          echo "Remote:"
          git remote -v || true
          echo ""
          echo "Commit:"
          git rev-parse HEAD
          echo ""
          echo "Kernel version:"
          make kernelversion || true

      # ============================================================
      # BASH
      # ============================================================
      - name: Setup Bash
        shell: bash
        run: |
          set -euxo pipefail
          sudo ln -sf /bin/bash /bin/sh
          echo "Shell:"
          bash --version | head -n 2 || true

      # ============================================================
      # CACHE APT & TOOLCHAIN
      # ============================================================
      - name: Cache APT
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: sukisu-apt-ubuntu22-v6
          restore-keys: |
            sukisu-apt-ubuntu22-

      - name: Cache Toolchains
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/toolchain_download
          key: sukisu-toolchain-r383902b-gcc14-v6
          restore-keys: |
            sukisu-toolchain-

      # ============================================================
      # DEPENDENCIES
      # ============================================================
      - name: Install Dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gcc g++ make bc bison flex libssl-dev \
            libelf-dev libncurses-dev libyaml-dev pkg-config ccache \
            python3 python3-minimal python2 git curl wget zip unzip \
            cpio gzip bzip2 xz-utils tar rsync file \
            device-tree-compiler libc++-dev libc++abi-dev \
            gcc-aarch64-linux-gnu clang lld

      # ============================================================
      # CLEAN SOURCE TREE & PATCH DTC UBUNTU 22.04
      # ============================================================
      - name: Clean Source Tree & Patch
        shell: bash
        run: |
          set -euxo pipefail
          cd "${GITHUB_WORKSPACE}"

          rm -rf "${GITHUB_WORKSPACE}/out"
          make mrproper
          rm -f "${GITHUB_WORKSPACE}/.config" "${GITHUB_WORKSPACE}/.config.old"
          rm -rf "${GITHUB_WORKSPACE}/include/config"
          mkdir -p "${GITHUB_WORKSPACE}/out"

          # Fix dtc compile error on GCC 10+ (multiple definition of yylloc)
          find scripts/dtc -type f -name "dtc-lexer.lex.c_shipped" -exec sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' {} + || true

      # ============================================================
      # SETUP TOOLCHAIN
      # ============================================================
      - name: Setup Toolchain
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="${GITHUB_WORKSPACE}"
          TC="${ROOT}/toolchain_download"
          CLANG_DIR="${TC}/clang-r383902b"
          GCC_DIR="${TC}/gcc-14.3"

          mkdir -p "${CLANG_DIR}" "${GCC_DIR}"

          # DOWNLOAD CLANG R383902B
          if [ ! -x "${CLANG_DIR}/bin/clang" ]; then
            rm -f /tmp/clang.tar.gz
            wget -q --show-progress -O /tmp/clang.tar.gz "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/0e9e7035bf8ad42437c6156e5950eab13655b26c/clang-r383902b.tar.gz"
            tar -xf /tmp/clang.tar.gz -C "${CLANG_DIR}"
            rm -f /tmp/clang.tar.gz
          fi

          # DOWNLOAD GCC 14.3
          if [ ! -x "${GCC_DIR}/bin/aarch64-none-linux-gnu-gcc" ]; then
            rm -f /tmp/gcc.tar.xz
            wget -q --show-progress -O /tmp/gcc.tar.xz "https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-aarch64-none-linux-gnu.tar.xz"
            tar -xf /tmp/gcc.tar.xz -C "${GCC_DIR}" --strip-components=1
            rm -f /tmp/gcc.tar.xz
          fi

          echo "${CLANG_DIR}/bin" >> "${GITHUB_PATH}"
          echo "${GCC_DIR}/bin" >> "${GITHUB_PATH}"

          # EXPORT ENVIRONMENT VARS
          {
            echo "ARCH=arm64"
            echo "SUBARCH=arm64"
            echo "CC=${CLANG_DIR}/bin/clang"
            echo "LD=${CLANG_DIR}/bin/ld.lld"
            echo "AR=${CLANG_DIR}/bin/llvm-ar"
            echo "NM=${CLANG_DIR}/bin/llvm-nm"
            echo "OBJCOPY=${CLANG_DIR}/bin/llvm-objcopy"
            echo "OBJDUMP=${CLANG_DIR}/bin/llvm-objdump"
            echo "STRIP=${CLANG_DIR}/bin/llvm-strip"
            echo "READELF=${CLANG_DIR}/bin/llvm-readelf"
            echo "LLVM=1"
            echo "LLVM_IAS=1"
            echo "CLANG_TRIPLE=aarch64-linux-gnu-"
            echo "CROSS_COMPILE=${GCC_DIR}/bin/aarch64-none-linux-gnu-"
            echo "HOSTCC=/usr/bin/gcc"
            echo "HOSTCXX=/usr/bin/g++"
            echo "HOSTLD=/usr/bin/ld"
            echo "HOSTAR=/usr/bin/ar"
            echo "HOSTAS=/usr/bin/as"
            echo "HOSTNM=/usr/bin/nm"
            echo "HOSTOBJCOPY=/usr/bin/objcopy"
            echo "HOSTOBJDUMP=/usr/bin/objdump"
            echo "HOSTSTRIP=/usr/bin/strip"
            echo "BSP_BUILD_FAMILY=sharkl3"
            echo "BSP_BUILD_ANDROID_OS=y"
            echo "DEFCONFIG=a3core_eur_open_defconfig"
            echo "KBUILD_BUILD_USER=SukiSU"
            echo "KBUILD_BUILD_HOST=SharkL3"
            echo "KBUILD_BUILD_TIMESTAMP=$(date -u '+%a %b %d %T UTC %Y')"
          } >> "${GITHUB_ENV}"

      # ============================================================
      # INTEGRATE SUKISU ULTRA
      # ============================================================
      - name: Integrate SukiSU Ultra
        shell: bash
        run: |
          set -euxo pipefail
          cd "${GITHUB_WORKSPACE}"

          if [ ! -d "${GITHUB_WORKSPACE}/drivers/kernelsu" ]; then
            curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin
          fi

          if [ ! -d "${GITHUB_WORKSPACE}/drivers/kernelsu" ]; then
            echo "[ERROR] drivers/kernelsu does not exist."
            exit 1
          fi

      # ============================================================
      # PREPARE DEFCONFIG
      # ============================================================
      - name: Prepare Defconfig
        shell: bash
        run: |
          set -euxo pipefail
          cd "${GITHUB_WORKSPACE}"

          export HOST_EXTRACFLAGS="-fcommon"
          export HOSTLDLIBS_dtc="-lyaml"
          export HOSTLOADLIBS_dtc="-lyaml"

          make O="${GITHUB_WORKSPACE}/out" ARCH="${ARCH}" \
            CROSS_COMPILE="${CROSS_COMPILE}" CLANG_TRIPLE="${CLANG_TRIPLE}" \
            CC="${CC}" HOSTCC="${HOSTCC}" HOSTCXX="${HOSTCXX}" HOSTLD="${HOSTLD}" \
            HOSTAR="${HOSTAR}" HOSTAS="${HOSTAS}" HOSTNM="${HOSTNM}" \
            HOSTOBJCOPY="${HOSTOBJCOPY}" HOSTOBJDUMP="${HOSTOBJDUMP}" HOSTSTRIP="${HOSTSTRIP}" \
            LD="${LD}" AR="${AR}" NM="${NM}" OBJCOPY="${OBJCOPY}" \
            OBJDUMP="${OBJDUMP}" STRIP="${STRIP}" LLVM="${LLVM}" LLVM_IAS="${LLVM_IAS}" \
            BSP_BUILD_FAMILY="${BSP_BUILD_FAMILY}" BSP_BUILD_ANDROID_OS="${BSP_BUILD_ANDROID_OS}" \
            "${DEFCONFIG}"

      # ============================================================
      # CONFIGURE SUKISU
      # ============================================================
      - name: Configure SukiSU
        shell: bash
        run: |
          set -euxo pipefail
          cd "${GITHUB_WORKSPACE}"
          CONFIG="${GITHUB_WORKSPACE}/out/.config"

          ./scripts/config --file "${CONFIG}" --enable CONFIG_KSU
          ./scripts/config --file "${CONFIG}" --enable CONFIG_KPROBES

          if grep -q "KSU_KPROBES_KSUD" "${GITHUB_WORKSPACE}/drivers/kernelsu/Kconfig" 2>/dev/null; then
            ./scripts/config --file "${CONFIG}" --enable CONFIG_KSU_KPROBES_KSUD || true
          fi

          if grep -q "CONFIG_KSU_LSM_SECURITY_HOOKS" "${CONFIG}"; then
            ./scripts/config --file "${CONFIG}" --enable CONFIG_KSU_LSM_SECURITY_HOOKS || true
          fi

          export HOST_EXTRACFLAGS="-fcommon"
          export HOSTLDLIBS_dtc="-lyaml"
          export HOSTLOADLIBS_dtc="-lyaml"

          make O="${GITHUB_WORKSPACE}/out" ARCH="${ARCH}" CC="${CC}" \
            HOSTCC="${HOSTCC}" HOSTCXX="${HOSTCXX}" HOSTLD="${HOSTLD}" \
            olddefconfig

      # ============================================================
      # BUILD KERNEL SEKALIGUS (IMAGE, MODULES, DTBS)
      # ============================================================
      - name: Build Kernel (Image, Modules, DTBs)
        shell: bash
        run: |
          set -euxo pipefail
          cd "${GITHUB_WORKSPACE}"

          # Patch Error DTBO SPRD (Typo dan -@ flag)
          sed -i 's|arch/arm64/boot/dts/sprd/||g' arch/arm64/boot/dts/sprd/Makefile || true
          sed -i '1s/^/DTC_FLAGS += -@\n/' arch/arm64/boot/dts/sprd/Makefile || true

          export HOST_EXTRACFLAGS="-fcommon"
          export HOSTLDLIBS_dtc="-lyaml"
          export HOSTLOADLIBS_dtc="-lyaml"

          make -C "${GITHUB_WORKSPACE}" O="${GITHUB_WORKSPACE}/out" -j"$(nproc)" \
            ARCH="${ARCH}" CC="${CC}" LD="${LD}" AR="${AR}" NM="${NM}" \
            OBJCOPY="${OBJCOPY}" OBJDUMP="${OBJDUMP}" STRIP="${STRIP}" READELF="${READELF}" \
            HOSTCC="${HOSTCC}" HOSTCXX="${HOSTCXX}" HOSTLD="${HOSTLD}" HOSTAR="${HOSTAR}" \
            HOSTAS="${HOSTAS}" HOSTNM="${HOSTNM}" HOSTOBJCOPY="${HOSTOBJCOPY}" \
            HOSTOBJDUMP="${HOSTOBJDUMP}" HOSTSTRIP="${HOSTSTRIP}" \
            LLVM="${LLVM}" LLVM_IAS="${LLVM_IAS}" \
            CROSS_COMPILE="${CROSS_COMPILE}" CLANG_TRIPLE="${CLANG_TRIPLE}" \
            BSP_BUILD_FAMILY="${BSP_BUILD_FAMILY}" BSP_BUILD_ANDROID_OS="${BSP_BUILD_ANDROID_OS}" \
            Image dtbs modules

          # Verifikasi singkat
          ls -lh "${GITHUB_WORKSPACE}/out/arch/arm64/boot/Image" || true

      # ============================================================
      # COLLECT ARTIFACTS
      # ============================================================
      - name: Collect Artifacts
        shell: bash
        run: |
          set -euo pipefail
          OUT="${GITHUB_WORKSPACE}/out"
          ART="${GITHUB_WORKSPACE}/output_artifacts"

          rm -rf "${ART}"
          mkdir -p "${ART}/dtbs" "${ART}/modules" "${ART}/kernelsu"

          # Copy Image & Config
          cp "${OUT}/arch/arm64/boot/Image" "${ART}/Image"
          cp "${OUT}/.config" "${ART}/kernel.config"

          [ -f "${OUT}/System.map" ] && cp "${OUT}/System.map" "${ART}/System.map"
          [ -f "${OUT}/Module.symvers" ] && cp "${OUT}/Module.symvers" "${ART}/Module.symvers"
          [ -f "${OUT}/include/config/kernel.release" ] && cp "${OUT}/include/config/kernel.release" "${ART}/kernel.release"

          # Copy DTBS
          if [ -d "${OUT}/arch/arm64/boot/dts" ]; then
            find "${OUT}/arch/arm64/boot/dts" -type f \( -name "*.dtb" -o -name "*.dtbo" \) -exec cp --parents {} "${ART}/dtbs/" \;
          fi

          # Copy Modules
          find "${OUT}" -type f -name "*.ko" -print0 | while IFS= read -r -d '' ko; do
            rel="${ko#${OUT}/}"
            mkdir -p "${ART}/modules/$(dirname "${rel}")"
            cp "${ko}" "${ART}/modules/${rel}"
          done

          # Info KernelSU
          echo "SukiSU Ultra" > "${ART}/kernelsu/version"
          echo "KPROBES" > "${ART}/kernelsu/hook"
          if [ -d "${GITHUB_WORKSPACE}/drivers/kernelsu/.git" ]; then
            git -C "${GITHUB_WORKSPACE}/drivers/kernelsu" rev-parse HEAD > "${ART}/kernelsu/commit"
          else
            echo "builtin" > "${ART}/kernelsu/commit"
          fi

          # Generate SHA256
          (
            cd "${ART}"
            find . -type f ! -name "SHA256SUMS" -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )

      # ============================================================
      # UPLOAD
      # ============================================================
      - name: Upload SukiSU Kernel
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Ultra-SharkL3-4.14
          path: output_artifacts/
          if-no-files-found: error
          retention-days: 14
