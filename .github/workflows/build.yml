name: Build Kernel - ReSukiSu (Manual Hook)

on:
  workflow_dispatch:

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    env:
      ARCH: arm64
      SUBARCH: arm64
      DEFCONFIG: a3core_eur_open_defconfig

    steps:
      - name: Checkout Kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev libyaml-dev pkg-config device-tree-compiler python3 git curl wget zip unzip cpio xz-utils tar libncurses-dev

      - name: Setup Toolchains (GCC 14.3 & Clang)
        run: |
          mkdir -p toolchains/gcc-14.3 toolchains/clang-r383902b
          
          echo "Downloading Clang..."
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/0e9e7035bf8ad42437c6156e5950eab13655b26c/clang-r383902b.tar.gz -O clang.tar.gz
          tar -xf clang.tar.gz -C toolchains/clang-r383902b
          rm clang.tar.gz
          
          echo "Downloading GCC 14.3..."
          wget -q https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-aarch64-none-linux-gnu.tar.xz -O gcc.tar.xz
          tar -xf gcc.tar.xz -C toolchains/gcc-14.3 --strip-components=1
          rm gcc.tar.xz

      - name: Setup KernelSU Next (Legacy Branch)
        run: |
          rm -rf drivers/kernelsu
curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s legacy

      - name: Run Build Script (b.sh)
        run: |
          chmod +x b.sh
          ./b.sh

      - name: Build AnyKernel3 Flashable Zip
        run: |
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3.git AK3
          cp out/arch/arm64/boot/Image AK3/
          cd AK3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel.sh
          sed -i "s/kernel.string=.*/kernel.string=A032F-KSU-Next-ManualHook/g" anykernel.sh
          sed -i 's|BLOCK=.*|BLOCK=auto;|g' anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=0;/g' anykernel.sh
          sed -i '/# init.rc/,/append_file fstab.tuna.*/d' anykernel.sh
          
          zip -r9 "../AnyKernel3-A032F-KSU-Next.zip" . -x '.git/*' '.github/*'
          cd ..
          echo "[OK] AnyKernel3 zip generated."

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-A032F-KSU-Next
          path: |
            output_artifacts/
            AnyKernel3-A032F-KSU-Next.zip
          if-no-files-found: error
