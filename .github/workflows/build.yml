name: Build Kernel - KernelSU Next Latest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      ARCH: arm64
      SUBARCH: arm64
      DEFCONFIG: a3core_eur_open_defconfig
      KERNEL_ROOT: ${{ github.workspace }}

    steps:
      # ==========================================================
      # CHECKOUT
      # ==========================================================
      - name: Checkout Kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      # ==========================================================
      # DEPENDENCIES
      # ==========================================================
      - name: Install Dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            gcc \
            g++ \
            binutils \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libyaml-dev \
            libncurses-dev \
            python3 \
            python2 \
            git \
            curl \
            wget \
            unzip \
            zip \
            cpio \
            tar \
            xz-utils \
            device-tree-compiler \
            rsync \
            file \
            lz4 \
            zstd

          echo "=================================================="
          echo "DEPENDENCIES"
          echo "=================================================="

          gcc --version | head -n 1
          g++ --version | head -n 1
          ld.bfd --version | head -n 1
          make --version | head -n 1

      # ==========================================================
      # TOOLCHAIN CACHE
      # ==========================================================
      - name: Cache Toolchains
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/toolchains
          key: android-kernel-toolchains-clang-r383902b-gcc14-v1
          restore-keys: |
            android-kernel-toolchains-

      # ==========================================================
      # TOOLCHAIN
      # ==========================================================
      - name: Setup Clang r383902b + GCC 14.3
        shell: bash
        run: |
          set -euxo pipefail

          TOOLCHAIN="${GITHUB_WORKSPACE}/toolchains"

          mkdir -p "$TOOLCHAIN/clang-r383902b"
          mkdir -p "$TOOLCHAIN/gcc-14.3"

          # ------------------------------------------------------
          # Clang r383902b
          # ------------------------------------------------------
          if [ ! -x "$TOOLCHAIN/clang-r383902b/bin/clang" ]; then
            echo "[+] Downloading Clang r383902b..."

            wget -q \
              "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/0e9e7035bf8ad42437c6156e5950eab13655b26c/clang-r383902b.tar.gz" \
              -O /tmp/clang.tar.gz

            tar -xf /tmp/clang.tar.gz \
              -C "$TOOLCHAIN/clang-r383902b"

            rm -f /tmp/clang.tar.gz
          else
            echo "[=] Clang already cached."
          fi

          # ------------------------------------------------------
          # GCC 14.3
          # ------------------------------------------------------
          if [ ! -x "$TOOLCHAIN/gcc-14.3/bin/aarch64-none-linux-gnu-gcc" ]; then
            echo "[+] Downloading GCC 14.3..."

            wget -q \
              "https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-aarch64-none-linux-gnu.tar.xz" \
              -O /tmp/gcc.tar.xz

            tar -xf /tmp/gcc.tar.xz \
              -C "$TOOLCHAIN/gcc-14.3" \
              --strip-components=1

            rm -f /tmp/gcc.tar.xz
          else
            echo "[=] GCC already cached."
          fi

          # ------------------------------------------------------
          # PATH
          # ------------------------------------------------------
          echo "$TOOLCHAIN/clang-r383902b/bin" >> "$GITHUB_PATH"
          echo "$TOOLCHAIN/gcc-14.3/bin" >> "$GITHUB_PATH"

          echo "TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"

          echo "CLANG_PATH=$TOOLCHAIN/clang-r383902b/bin" >> "$GITHUB_ENV"
          echo "GCC_PATH=$TOOLCHAIN/gcc-14.3/bin" >> "$GITHUB_ENV"

          echo "CROSS_COMPILE=$TOOLCHAIN/gcc-14.3/bin/aarch64-none-linux-gnu-" >> "$GITHUB_ENV"
          echo "CROSS_COMPILE_ARM32=$TOOLCHAIN/gcc-14.3/bin/arm-none-linux-gnueabihf-" >> "$GITHUB_ENV"

      # ==========================================================
      # VERIFY TOOLCHAIN
      # ==========================================================
      - name: Verify Toolchain
        shell: bash
        run: |
          set -euxo pipefail

          echo "=================================================="
          echo "TOOLCHAIN"
          echo "=================================================="

          which clang
          which ld.lld
          which llvm-ar
          which llvm-nm
          which gcc
          which aarch64-none-linux-gnu-gcc

          clang --version | head -n 2
          ld.lld --version | head -n 1
          llvm-ar --version | head -n 1
          gcc --version | head -n 1
          aarch64-none-linux-gnu-gcc --version | head -n 1

          test -x "$CLANG_PATH/clang"
          test -x "$CLANG_PATH/ld.lld"
          test -x "$CLANG_PATH/llvm-ar"
          test -x "$CLANG_PATH/llvm-nm"

      # ==========================================================
      # CLEAN SOURCE / OUTPUT
      # ==========================================================
      - name: Clean Kernel Tree
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL_ROOT"

          echo "=================================================="
          echo "CLEANING BUILD TREE"
          echo "=================================================="

          rm -rf out
          rm -rf output_artifacts
          rm -rf dtbs_output

          # Remove previous KernelSU installations if present.
          rm -rf KernelSU
          rm -rf KernelSU-Next

          if [ -e drivers/kernelsu ]; then
            rm -rf drivers/kernelsu
          fi

          # Make the kernel source clean BEFORE integrating KSU.
          make mrproper

          mkdir -p out
          mkdir -p output_artifacts

          echo "[OK] Kernel source cleaned."

      # ==========================================================
      # REMOVE OLD KSU REFERENCES
      # ==========================================================
      - name: Prepare KernelSU Next Integration
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL_ROOT"

          echo "=================================================="
          echo "PREPARING KERNELSU NEXT"
          echo "=================================================="

          rm -rf KernelSU
          rm -rf KernelSU-Next
          rm -rf drivers/kernelsu

          # Remove stale KSU references that may have been left
          # by an older embedded driver.
          find drivers -maxdepth 2 \
            -type d \
            -iname '*kernelsu*' \
            -print || true

      # ==========================================================
      # INTEGRATE KERNELSU NEXT
      # ==========================================================
      - name: Integrate KernelSU Next Latest
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL_ROOT"

          echo "=================================================="
          echo "KERNELSU NEXT INTEGRATION"
          echo "=================================================="

          curl -LSs \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" \
            | bash -s legacy

          echo "=================================================="
          echo "KERNELSU TREE"
          echo "=================================================="

          test -e drivers/kernelsu

          ls -la drivers/kernelsu || true

          if [ -f drivers/kernelsu/Makefile ]; then
            head -n 30 drivers/kernelsu/Makefile || true
          fi

          if [ -f drivers/kernelsu/Kconfig ]; then
            echo "[OK] KernelSU Next Kconfig found."
          else
            echo "[ERROR] KernelSU Next Kconfig missing."
            exit 1
          fi

      # ==========================================================
      # PREPARE CONFIG
      # ==========================================================
      - name: Prepare Defconfig
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL_ROOT"

          echo "=================================================="
          echo "DEFCONFIG"
          echo "=================================================="

          make -C "$KERNEL_ROOT" \
            O="$KERNEL_ROOT/out" \
            ARCH="$ARCH" \
            CC=clang \
            LD=ld.lld \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            HOSTLD=ld.bfd \
            "$DEFCONFIG"

          test -f out/.config

          echo "[OK] Defconfig generated."

      # ==========================================================
      # CONFIGURE KERNELSU NEXT
      # ==========================================================
      - name: Configure KernelSU Next
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL_ROOT"

          echo "=================================================="
          echo "CONFIGURING KERNELSU NEXT"
          echo "=================================================="

          test -f out/.config

          # scripts/config normally exists in this kernel tree.
          if [ ! -x scripts/config ]; then
            chmod +x scripts/config || true
          fi

          if [ ! -x scripts/config ]; then
            echo "[+] Building scripts/config..."
            make -C "$KERNEL_ROOT" \
              O="$KERNEL_ROOT/out" \
              ARCH="$ARCH" \
              HOSTCC=gcc \
              HOSTCXX=g++ \
              HOSTLD=ld.bfd \
              scripts
          fi

          test -x scripts/config

          # ------------------------------------------------------
          # Required by KernelSU Next legacy/kprobe integration.
          # ------------------------------------------------------
          scripts/config --file out/.config --enable KPROBES
          scripts/config --file out/.config --enable KPROBE_EVENTS
          scripts/config --file out/.config --enable KSU
          scripts/config --file out/.config --enable KSU_KPROBE_HOOKS

          # Kernel modules are useful for this legacy vendor tree.
          scripts/config --file out/.config --enable MODULES

          # Keep existing Android/vendor settings untouched.
          make -C "$KERNEL_ROOT" \
            O="$KERNEL_ROOT/out" \
            ARCH="$ARCH" \
            CC=clang \
            LD=ld.lld \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            HOSTLD=ld.bfd \
            olddefconfig

          echo ""
          echo "=================================================="
          echo "KERNELSU CONFIG"
          echo "=================================================="

          grep -E \
            '^(CONFIG_KSU|CONFIG_KPROBES|CONFIG_KPROBE_EVENTS|CONFIG_MODULES)=' \
            out/.config || true

          echo ""
          echo "=================================================="
          echo "CONFIG VALIDATION"
          echo "=================================================="

          grep -q '^CONFIG_KSU=y$' out/.config
          grep -q '^CONFIG_KPROBES=y$' out/.config
          grep -q '^CONFIG_KPROBE_EVENTS=y$' out/.config
          grep -q '^CONFIG_KSU_KPROBE_HOOKS=y$' out/.config

          echo "[OK] Required KernelSU Next configuration is enabled."

      # ==========================================================
      # BUILD KERNEL
      # ==========================================================
      - name: Build Kernel Image
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL_ROOT"

          echo "=================================================="
          echo "BUILD KERNEL"
          echo "=================================================="

          export KBUILD_BUILD_USER="KernelSU-Next"
          export KBUILD_BUILD_HOST="GitHub-Actions"
          export KBUILD_BUILD_TIMESTAMP="$(date -u '+%a %b %d %T UTC %Y')"

          # Old vendor kernels sometimes contain obsolete YAML DTC
          # integration which breaks host compilation.
          sed -i '/yamltree\.o/d' scripts/dtc/Makefile || true
          sed -i '/dt_to_yaml/d' scripts/dtc/dtc.c || true

          make -C "$KERNEL_ROOT" \
            O="$KERNEL_ROOT/out" \
            -j"$(nproc)" \
            ARCH="$ARCH" \
            SUBARCH="$SUBARCH" \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            HOSTLD=ld.bfd \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            Image

          test -s "$KERNEL_ROOT/out/arch/arm64/boot/Image"

          echo "=================================================="
          echo "KERNEL IMAGE"
          echo "=================================================="

          ls -lh "$KERNEL_ROOT/out/arch/arm64/boot/Image"
          file "$KERNEL_ROOT/out/arch/arm64/boot/Image"

      # ==========================================================
      # BUILD MODULES
      # ==========================================================
      - name: Build Kernel Modules
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL_ROOT"

          echo "=================================================="
          echo "BUILD MODULES"
          echo "=================================================="

          make -C "$KERNEL_ROOT" \
            O="$KERNEL_ROOT/out" \
            -j"$(nproc)" \
            ARCH="$ARCH" \
            SUBARCH="$SUBARCH" \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            HOSTLD=ld.bfd \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            modules

          echo ""
          echo "Module count:"
          find "$KERNEL_ROOT/out" \
            -type f \
            -name '*.ko' \
            | wc -l

      # ==========================================================
      # BUILD DTB / DTBO
      # ==========================================================
      - name: Build DTB DTBO
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL_ROOT"

          echo "=================================================="
          echo "BUILD DTB / DTBO"
          echo "=================================================="

          make -C "$KERNEL_ROOT" \
            O="$KERNEL_ROOT/out" \
            -j"$(nproc)" \
            ARCH="$ARCH" \
            SUBARCH="$SUBARCH" \
            CC=clang \
            LD=ld.lld \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            HOSTLD=ld.bfd \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            dtbs || {
              echo "[WARN] dtbs target failed."
              echo "[WARN] Collecting any DTB/DTBO already produced..."
            }

          echo ""
          echo "=================================================="
          echo "DTB / DTBO"
          echo "=================================================="

          find "$KERNEL_ROOT/out/arch/arm64/boot" \
            -type f \
            \( -name '*.dtb' -o -name '*.dtbo' \) \
            | sort || true

      # ==========================================================
      # VERIFY KERNELSU
      # ==========================================================
      - name: Verify KernelSU Next
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL_ROOT"

          echo "=================================================="
          echo "KERNELSU NEXT VERIFICATION"
          echo "=================================================="

          test -e drivers/kernelsu

          echo "[OK] drivers/kernelsu exists."

          echo ""
          echo "KSU CONFIG:"
          grep -nE \
            '^CONFIG_KSU|^# CONFIG_KSU' \
            out/.config || true

          echo ""
          echo "KPROBE CONFIG:"
          grep -nE \
            '^CONFIG_KPROBES|^CONFIG_KPROBE_EVENTS|^CONFIG_KSU_KPROBE_HOOKS' \
            out/.config || true

          echo ""
          echo "KSU TREE:"
          find drivers/kernelsu \
            -maxdepth 2 \
            -type f \
            | sort \
            | head -n 100

          echo ""
          echo "=================================================="
          echo "KSU VERSION / GIT"
          echo "=================================================="

          if [ -d drivers/kernelsu/.git ]; then
            git -C drivers/kernelsu describe --tags --always || true
            git -C drivers/kernelsu rev-parse HEAD || true
            git -C drivers/kernelsu tag --points-at HEAD || true
          else
            echo "[INFO] drivers/kernelsu is not a git repository."
          fi

          # Required build configuration.
          grep -q '^CONFIG_KSU=y$' out/.config
          grep -q '^CONFIG_KPROBES=y$' out/.config
          grep -q '^CONFIG_KPROBE_EVENTS=y$' out/.config
          grep -q '^CONFIG_KSU_KPROBE_HOOKS=y$' out/.config

          echo ""
          echo "[OK] KernelSU Next integration verified."

      # ==========================================================
      # KSU VERSION FILE
      # ==========================================================
      - name: Generate KernelSU Metadata
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL_ROOT"

          ART="$KERNEL_ROOT/output_artifacts"

          mkdir -p "$ART"
          mkdir -p "$ART/dtbs"
          mkdir -p "$ART/modules"

          # ------------------------------------------------------
          # KernelSU commit/version
          # ------------------------------------------------------
          if [ -d drivers/kernelsu/.git ]; then
            git -C drivers/kernelsu rev-parse HEAD \
              > "$ART/kernelsu.commit" || true

            git -C drivers/kernelsu describe --tags --always \
              > "$ART/kernelsu.version" || true
          else
            echo "unknown" > "$ART/kernelsu.commit"
            echo "unknown" > "$ART/kernelsu.version"
          fi

          # ------------------------------------------------------
          # Kernel config
          # ------------------------------------------------------
          cp out/.config "$ART/kernel.config"

          # ------------------------------------------------------
          # Kernel release
          # ------------------------------------------------------
          make -C "$KERNEL_ROOT" \
            O="$KERNEL_ROOT/out" \
            ARCH="$ARCH" \
            CC=clang \
            LD=ld.lld \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            HOSTLD=ld.bfd \
            kernelrelease \
            > "$ART/kernel.release"

          # ------------------------------------------------------
          # UAPI/version inspection
          # ------------------------------------------------------
          {
            echo "KernelSU Next UAPI inspection"
            echo "================================"
            grep -Rni \
              -E 'UAPI_VERSION|uapi_version|KERNEL_SU_UAPI_VERSION' \
              drivers/kernelsu \
              --include='*.h' \
              --include='*.c' \
              2>/dev/null || true
          } > "$ART/kernelsu.uapi"

          # ------------------------------------------------------
          # KSU config
          # ------------------------------------------------------
          grep -E \
            '^(CONFIG_KSU|CONFIG_KPROBES|CONFIG_KPROBE_EVENTS|CONFIG_MODULES)' \
            out/.config \
            > "$ART/kernelsu.config" || true

      # ==========================================================
      # COLLECT IMAGE
      # ==========================================================
      - name: Collect Kernel Artifacts
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL_ROOT"

          ART="$KERNEL_ROOT/output_artifacts"
          OUT="$KERNEL_ROOT/out"

          echo "=================================================="
          echo "COLLECTING ARTIFACTS"
          echo "=================================================="

          # Image
          cp "$OUT/arch/arm64/boot/Image" \
            "$ART/Image"

          # System.map
          if [ -f "$OUT/System.map" ]; then
            cp "$OUT/System.map" "$ART/System.map"
          fi

          # Module.symvers
          if [ -f "$OUT/Module.symvers" ]; then
            cp "$OUT/Module.symvers" "$ART/Module.symvers"
          fi

          # ------------------------------------------------------
          # DTB / DTBO
          # ------------------------------------------------------
          find "$OUT/arch/arm64/boot" \
            -type f \
            \( -name '*.dtb' -o -name '*.dtbo' \) \
            -print0 \
            | while IFS= read -r -d '' file; do
                rel="${file#$OUT/arch/arm64/boot/}"
                mkdir -p "$ART/dtbs/$(dirname "$rel")"
                cp "$file" "$ART/dtbs/$rel"
              done

          # ------------------------------------------------------
          # Modules
          # ------------------------------------------------------
          find "$OUT" \
            -type f \
            -name '*.ko' \
            -print0 \
            | while IFS= read -r -d '' file; do
                rel="${file#$OUT/}"
                mkdir -p "$ART/modules/$(dirname "$rel")"
                cp "$file" "$ART/modules/$rel"
              done

          echo ""
          echo "=================================================="
          echo "FINAL ARTIFACTS"
          echo "=================================================="

          find "$ART" \
            -type f \
            -exec ls -lh {} \;

      # ==========================================================
      # SHA256
      # ==========================================================
      - name: Generate SHA256SUMS
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL_ROOT/output_artifacts"

          find . \
            -type f \
            ! -name SHA256SUMS \
            -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > SHA256SUMS

          echo "=================================================="
          echo "SHA256"
          echo "=================================================="

          cat SHA256SUMS

      # ==========================================================
      # FINAL SUMMARY
      # ==========================================================
      - name: Final Verification
        shell: bash
        run: |
          set -euxo pipefail

          cd "$KERNEL_ROOT"

          echo "=================================================="
          echo "FINAL VERIFICATION"
          echo "=================================================="

          test -s output_artifacts/Image
          test -s output_artifacts/kernel.config
          test -s output_artifacts/kernel.release
          test -s output_artifacts/kernelsu.config
          test -s output_artifacts/SHA256SUMS

          echo ""
          echo "Kernel release:"
          cat output_artifacts/kernel.release

          echo ""
          echo "KernelSU:"
          cat output_artifacts/kernelsu.version || true

          echo ""
          echo "DTB/DTBO count:"
          find output_artifacts/dtbs \
            -type f \
            \( -name '*.dtb' -o -name '*.dtbo' \) \
            | wc -l

          echo ""
          echo "Module count:"
          find output_artifacts/modules \
            -type f \
            -name '*.ko' \
            | wc -l

          echo ""
          echo "=================================================="
          echo "[OK] BUILD COMPLETED"
          echo "=================================================="

      # ==========================================================
      # UPLOAD ARTIFACT
      # ==========================================================
      - name: Upload KernelSU Next Build
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Next-Latest-Sprd
          path: |
            ${{ github.workspace }}/output_artifacts/Image
            ${{ github.workspace }}/output_artifacts/dtbs
            ${{ github.workspace }}/output_artifacts/modules
            ${{ github.workspace }}/output_artifacts/kernel.config
            ${{ github.workspace }}/output_artifacts/kernel.release
            ${{ github.workspace }}/output_artifacts/kernelsu.commit
            ${{ github.workspace }}/output_artifacts/kernelsu.version
            ${{ github.workspace }}/output_artifacts/kernelsu.config
            ${{ github.workspace }}/output_artifacts/kernelsu.uapi
            ${{ github.workspace }}/output_artifacts/System.map
            ${{ github.workspace }}/output_artifacts/Module.symvers
            ${{ github.workspace }}/output_artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
