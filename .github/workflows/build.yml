name: Build Kernel - Backslash KernelSU v3.3.0-30

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel-build:
    name: Build ARM64 Kernel
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64

      BSP_BUILD_FAMILY: sharkl3
      BSP_BUILD_ANDROID_OS: y

      DEFCONFIG: a3core_eur_open_defconfig

      KSU_VERSION: v3.3.0-30

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      # =========================================================
      # 2. SYSTEM INFORMATION
      # =========================================================

      - name: System Information
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "SYSTEM INFORMATION"
          echo "=================================================="

          echo ""
          echo "OS:"
          cat /etc/os-release

          echo ""
          echo "Kernel:"
          uname -a

          echo ""
          echo "CPU:"
          nproc

          echo ""
          echo "Memory:"
          free -h

          echo ""
          echo "Disk:"
          df -h .

      # =========================================================
      # 3. INSTALL DEPENDENCIES
      # =========================================================

      - name: Install Build Dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libyaml-dev \
            libncurses-dev \
            pkg-config \
            device-tree-compiler \
            libc++-dev \
            libc++abi-dev \
            python3 \
            python3-minimal \
            python-is-python3 \
            git \
            zip \
            unzip \
            curl \
            wget \
            cpio \
            tar \
            gzip \
            xz-utils \
            rsync \
            file \
            ca-certificates \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            ccache

          echo ""
          echo "=================================================="
          echo "DEPENDENCIES INSTALLED"
          echo "=================================================="

          echo ""
          echo "GCC:"
          gcc --version

          echo ""
          echo "Clang:"
          clang --version

          echo ""
          echo "LLD:"
          ld.lld --version

          echo ""
          echo "Make:"
          make --version

          echo ""
          echo "Git:"
          git --version

      # =========================================================
      # 4. LIBYAML TEST
      # =========================================================

      - name: Verify LibYAML
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "LIBYAML CHECK"
          echo "=================================================="

          pkg-config --cflags yaml-0.1
          pkg-config --libs yaml-0.1

          cat > /tmp/test_yaml.c <<'EOF'
          #include <yaml.h>

          int main(void)
          {
              yaml_emitter_t emitter;

              if (!yaml_emitter_initialize(&emitter))
                  return 1;

              yaml_emitter_delete(&emitter);

              return 0;
          }
          EOF

          gcc \
            /tmp/test_yaml.c \
            -lyaml \
            -o /tmp/test_yaml

          /tmp/test_yaml

          rm -f /tmp/test_yaml.c
          rm -f /tmp/test_yaml

          echo ""
          echo "[OK] LibYAML is working."

      # =========================================================
      # 5. CACHE TOOLCHAIN
      # =========================================================

      - name: Restore Toolchain Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/toolchain_download
          key: kernel-toolchain-clang-r383902b-gcc14-v4
          restore-keys: |
            kernel-toolchain-

      # =========================================================
      # 6. DOWNLOAD TOOLCHAINS
      # =========================================================

      - name: Setup Toolchains
        shell: bash
        run: |
          set -e

          TOOLCHAIN_DIR="${GITHUB_WORKSPACE}/toolchain_download"

          mkdir -p \
            "${TOOLCHAIN_DIR}/clang-r383902b" \
            "${TOOLCHAIN_DIR}/gcc-14.3"

          # =====================================================
          # CLANG R383902B
          # =====================================================

          if [ ! -x "${TOOLCHAIN_DIR}/clang-r383902b/bin/clang" ]; then

            echo "=================================================="
            echo "DOWNLOADING CLANG R383902B"
            echo "=================================================="

            rm -rf "${TOOLCHAIN_DIR}/clang-r383902b"

            mkdir -p \
              "${TOOLCHAIN_DIR}/clang-r383902b"

            wget \
              --retry-connrefused \
              --tries=5 \
              --timeout=60 \
              --progress=dot:giga \
              "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/0e9e7035bf8ad42437c6156e5950eab13655b26c/clang-r383902b.tar.gz" \
              -O /tmp/clang-r383902b.tar.gz

            tar \
              -xzf /tmp/clang-r383902b.tar.gz \
              -C "${TOOLCHAIN_DIR}/clang-r383902b"

            rm -f /tmp/clang-r383902b.tar.gz

          else

            echo "[OK] Clang r383902b already cached."

          fi

          # =====================================================
          # GCC 14.3
          # =====================================================

          if [ ! -x "${TOOLCHAIN_DIR}/gcc-14.3/bin/aarch64-none-linux-gnu-gcc" ]; then

            echo "=================================================="
            echo "DOWNLOADING ARM GCC 14.3"
            echo "=================================================="

            rm -rf "${TOOLCHAIN_DIR}/gcc-14.3"

            mkdir -p \
              "${TOOLCHAIN_DIR}/gcc-14.3"

            wget \
              --retry-connrefused \
              --tries=5 \
              --timeout=60 \
              --progress=dot:giga \
              "https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-aarch64-none-linux-gnu.tar.xz" \
              -O /tmp/gcc-14.3.tar.xz

            tar \
              -xJf /tmp/gcc-14.3.tar.xz \
              -C "${TOOLCHAIN_DIR}/gcc-14.3" \
              --strip-components=1

            rm -f /tmp/gcc-14.3.tar.xz

          else

            echo "[OK] GCC 14.3 already cached."

          fi

          # =====================================================
          # CHECK FILES
          # =====================================================

          echo ""
          echo "=================================================="
          echo "TOOLCHAIN FILE CHECK"
          echo "=================================================="

          test -x \
            "${TOOLCHAIN_DIR}/clang-r383902b/bin/clang"

          test -x \
            "${TOOLCHAIN_DIR}/gcc-14.3/bin/aarch64-none-linux-gnu-gcc"

          echo "[OK] Required toolchain binaries exist."

      # =========================================================
      # 7. TOOLCHAIN ENVIRONMENT
      # =========================================================

      - name: Configure Toolchain Environment
        shell: bash
        run: |
          set -e

          TOOLCHAIN_DIR="${GITHUB_WORKSPACE}/toolchain_download"

          CLANG_BIN="${TOOLCHAIN_DIR}/clang-r383902b/bin"
          GCC_BIN="${TOOLCHAIN_DIR}/gcc-14.3/bin"

          echo "${CLANG_BIN}" >> "${GITHUB_PATH}"
          echo "${GCC_BIN}" >> "${GITHUB_PATH}"

          echo "ARCH=arm64" >> "${GITHUB_ENV}"
          echo "SUBARCH=arm64" >> "${GITHUB_ENV}"

          echo "CC=clang" >> "${GITHUB_ENV}"
          echo "LD=ld.lld" >> "${GITHUB_ENV}"
          echo "AR=llvm-ar" >> "${GITHUB_ENV}"
          echo "NM=llvm-nm" >> "${GITHUB_ENV}"

          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> "${GITHUB_ENV}"

          echo "CROSS_COMPILE=${GCC_BIN}/aarch64-none-linux-gnu-" >> "${GITHUB_ENV}"

          # GCC package used here is AArch64.
          # Only export ARM32 compiler if it actually exists.
          if [ -x "${GCC_BIN}/arm-none-linux-gnueabihf-gcc" ]; then
            echo "CROSS_COMPILE_ARM32=${GCC_BIN}/arm-none-linux-gnueabihf-" >> "${GITHUB_ENV}"
          else
            echo "CROSS_COMPILE_ARM32=arm-linux-gnueabihf-" >> "${GITHUB_ENV}"
          fi

          echo "BSP_BUILD_FAMILY=sharkl3" >> "${GITHUB_ENV}"
          echo "BSP_BUILD_ANDROID_OS=y" >> "${GITHUB_ENV}"

          echo ""
          echo "=================================================="
          echo "TOOLCHAIN CONFIGURATION"
          echo "=================================================="

          echo "CLANG_BIN=${CLANG_BIN}"
          echo "GCC_BIN=${GCC_BIN}"
          echo "ARCH=arm64"
          echo "CC=clang"
          echo "LD=ld.lld"
          echo "CLANG_TRIPLE=aarch64-linux-gnu-"
          echo "CROSS_COMPILE=${GCC_BIN}/aarch64-none-linux-gnu-"

      # =========================================================
      # 8. TOOLCHAIN TEST
      # =========================================================

      - name: Verify Selected Toolchain
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "SELECTED TOOLCHAIN"
          echo "=================================================="

          echo ""
          echo "clang:"
          command -v clang
          clang --version

          echo ""
          echo "ld.lld:"
          command -v ld.lld
          ld.lld --version

          echo ""
          echo "llvm-ar:"
          command -v llvm-ar
          llvm-ar --version

          echo ""
          echo "llvm-nm:"
          command -v llvm-nm
          llvm-nm --version

          echo ""
          echo "aarch64-none-linux-gnu-gcc:"
          command -v aarch64-none-linux-gnu-gcc
          aarch64-none-linux-gnu-gcc --version

          echo ""
          echo "[OK] Toolchain is ready."

      # =========================================================
      # 9. KERNEL SOURCE CHECK
      # =========================================================

      - name: Verify Kernel Source
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "KERNEL SOURCE"
          echo "=================================================="

          echo ""
          echo "Git commit:"
          git rev-parse HEAD

          echo ""
          echo "Kernel version:"

          grep -E \
            '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)[[:space:]]*=' \
            Makefile

          echo ""
          echo "Defconfig:"

          test -f \
            "arch/arm64/configs/${DEFCONFIG}"

          echo "${DEFCONFIG}"

          echo ""
          echo "Architecture:"
          test -d arch/arm64

          echo ""
          echo "[OK] Kernel source verified."

      # =========================================================
      # 10. RUN BUILD SCRIPT
      # =========================================================

      - name: Build Kernel
        shell: bash
        run: |
          set -e

          chmod +x b.sh

          echo ""
          echo "=================================================="
          echo "STARTING B.SH"
          echo "=================================================="

          ./b.sh

      # =========================================================
      # 11. VERIFY KERNELSU
      # =========================================================

      - name: Verify KernelSU v3.3.0-30
        if: always()
        shell: bash
        run: |
          echo "=================================================="
          echo "KERNELSU VERIFICATION"
          echo "=================================================="

          if [ ! -d "KernelSU" ]; then
            echo "[ERROR] KernelSU directory does not exist."
            exit 0
          fi

          cd KernelSU

          echo ""
          echo "Remote:"
          git remote -v || true

          echo ""
          echo "Current commit:"
          git rev-parse HEAD || true

          echo ""
          echo "Current tag:"
          git describe --tags --always || true

          echo ""
          echo "Exact tag:"
          git describe --tags --exact-match 2>/dev/null || true

          cd ..

          echo ""
          echo "Expected:"
          echo "${KSU_VERSION}"

          echo ""
          echo "UAPI header:"

          if [ -f "KernelSU/uapi/supercall.h" ]; then
            grep \
              -n \
              "KERNEL_SU_UAPI_VERSION" \
              KernelSU/uapi/supercall.h || true
          else
            echo "supercall.h not found."
          fi

          echo ""
          echo "KernelSU config:"

          if [ -f "out/.config" ]; then
            grep \
              -n \
              "^CONFIG_KSU" \
              out/.config || true
          else
            echo "out/.config not found."
          fi

      # =========================================================
      # 12. VERIFY IMAGE
      # =========================================================

      - name: Verify Kernel Image
        if: always()
        shell: bash
        run: |
          echo "=================================================="
          echo "KERNEL IMAGE VERIFICATION"
          echo "=================================================="

          IMAGE="${GITHUB_WORKSPACE}/out/arch/arm64/boot/Image"

          if [ -f "${IMAGE}" ]; then

            echo "[OK] Image generated."

            ls -lh "${IMAGE}"

            echo ""
            echo "File:"
            file "${IMAGE}"

            echo ""
            echo "SHA256:"
            sha256sum "${IMAGE}"

          else

            echo "[ERROR] Image was not generated."

          fi

      # =========================================================
      # 13. VERIFY MODULES
      # =========================================================

      - name: Verify Kernel Modules
        if: always()
        shell: bash
        run: |
          echo "=================================================="
          echo "KERNEL MODULE VERIFICATION"
          echo "=================================================="

          if [ -d "out" ]; then

            MODULE_COUNT="$(
              find out \
                -type f \
                -name "*.ko" \
                | wc -l
            )"

            echo "Module count: ${MODULE_COUNT}"

            if [ "${MODULE_COUNT}" -gt 0 ]; then

              find out \
                -type f \
                -name "*.ko" \
                | sort

            else

              echo "No .ko modules found."

            fi

          else

            echo "out directory does not exist."

          fi

      # =========================================================
      # 14. VERIFY DTBS
      # =========================================================

      - name: Verify DTBs
        if: always()
        shell: bash
        run: |
          echo "=================================================="
          echo "DTB / DTBO VERIFICATION"
          echo "=================================================="

          DTB_DIR="out/arch/arm64/boot/dts"

          if [ -d "${DTB_DIR}" ]; then

            DTB_COUNT="$(
              find "${DTB_DIR}" \
                -type f \
                \( \
                  -name "*.dtb" \
                  -o \
                  -name "*.dtbo" \
                \) \
                | wc -l
            )"

            echo "DTB/DTBO count: ${DTB_COUNT}"

            find "${DTB_DIR}" \
              -type f \
              \( \
                -name "*.dtb" \
                -o \
                -name "*.dtbo" \
              \) \
              | sort

          else

            echo "DTB directory does not exist."

          fi

      # =========================================================
      # 15. LIST OUTPUT
      # =========================================================

      - name: List Build Artifacts
        if: always()
        shell: bash
        run: |
          echo "=================================================="
          echo "OUTPUT ARTIFACTS"
          echo "=================================================="

          if [ -d "output_artifacts" ]; then

            find output_artifacts \
              -type f \
              -exec ls -lh {} \;

          else

            echo "output_artifacts does not exist."

          fi

      # =========================================================
      # 16. UPLOAD FINAL ARTIFACT
      # =========================================================

      - name: Upload Kernel Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-v3.3.0-30-Sprd
          path: |
            ${{ github.workspace }}/output_artifacts/**
          if-no-files-found: error
          compression-level: 6
          retention-days: 7

      # =========================================================
      # 17. UPLOAD DEBUG ARTIFACT WHEN BUILD FAILS
      # =========================================================

      - name: Upload Build Debug Files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Build-Debug
          path: |
            ${{ github.workspace }}/out/.config
            ${{ github.workspace }}/out/Module.symvers
            ${{ github.workspace }}/out/System.map
            ${{ github.workspace }}/out/.version
            ${{ github.workspace }}/output_artifacts/**
          if-no-files-found: ignore
          compression-level: 6
          retention-days: 7
