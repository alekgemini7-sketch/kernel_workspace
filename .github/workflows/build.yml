name: Build Kernel - KernelSU v3.3.0-30

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel-compile:
    name: Build Kernel
    runs-on: ubuntu-22.04

    steps:

      # ==========================================================
      # CHECKOUT
      # ==========================================================

      - name: Checkout Source Kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      # ==========================================================
      # SHELL
      # ==========================================================

      - name: Setup Bash
        shell: bash
        run: |
          set -e

          sudo ln -sf /bin/bash /bin/sh

          echo "===== SHELL ====="
          ls -l /bin/sh
          bash --version | head -n 1

      # ==========================================================
      # CACHE TOOLCHAIN
      # ==========================================================

      - name: Cache Toolchains
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/toolchain_download
          key: kernel-toolchains-clang-r383902b-gcc14-v3
          restore-keys: |
            kernel-toolchains-

      # ==========================================================
      # CACHE APT
      # ==========================================================

      - name: Cache APT
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
          key: apt-ubuntu-22.04-kernel-v3
          restore-keys: |
            apt-ubuntu-22.04-kernel-

      # ==========================================================
      # SYSTEM DEPENDENCIES
      # ==========================================================

      - name: Install Dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libyaml-dev \
            libncurses-dev \
            pkg-config \
            device-tree-compiler \
            libc++-dev \
            libc++abi-dev \
            clang \
            lld \
            llvm \
            python3 \
            python3-minimal \
            git \
            zip \
            unzip \
            curl \
            wget \
            cpio \
            tar \
            gzip \
            xz-utils \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            ccache

          echo ""
          echo "===== DEPENDENCIES INSTALLED ====="

          gcc --version | head -n 1
          clang --version | head -n 1
          ld.lld --version | head -n 1
          make --version | head -n 1
          git --version

      # ==========================================================
      # LIBYAML CHECK
      # ==========================================================

      - name: Verify LibYAML
        shell: bash
        run: |
          set -e

          echo "===== PKG-CONFIG YAML ====="

          pkg-config --cflags yaml-0.1
          pkg-config --libs yaml-0.1

          cat > /tmp/test_yaml.c <<'EOF'
          #include <yaml.h>

          int main(void)
          {
              yaml_emitter_t emitter;

              if (!yaml_emitter_initialize(&emitter))
                  return 1;

              yaml_emitter_delete(&emitter);

              return 0;
          }
          EOF

          gcc \
            /tmp/test_yaml.c \
            -lyaml \
            -o /tmp/test_yaml

          /tmp/test_yaml

          echo "[OK] LibYAML works."

      # ==========================================================
      # DOWNLOAD TOOLCHAIN
      # ==========================================================

      - name: Prepare Toolchain
        shell: bash
        run: |
          set -e

          TOOLCHAIN_DIR="${GITHUB_WORKSPACE}/toolchain_download"

          mkdir -p \
            "${TOOLCHAIN_DIR}/clang-r383902b" \
            "${TOOLCHAIN_DIR}/gcc-14.3"

          # ======================================================
          # CLANG R383902B
          # ======================================================

          if [ ! -x \
            "${TOOLCHAIN_DIR}/clang-r383902b/bin/clang" ]; then

            echo "[+] Downloading Clang r383902b..."

            wget \
              --progress=dot:giga \
              --retry-connrefused \
              --tries=5 \
              --timeout=30 \
              "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/0e9e7035bf8ad42437c6156e5950eab13655b26c/clang-r383902b.tar.gz" \
              -O /tmp/clang-r383902b.tar.gz

            tar \
              -xf /tmp/clang-r383902b.tar.gz \
              -C "${TOOLCHAIN_DIR}/clang-r383902b"

            rm -f /tmp/clang-r383902b.tar.gz

          else

            echo "[=] Clang r383902b already cached."

          fi

          # ======================================================
          # GCC 14.3
          # ======================================================

          if [ ! -x \
            "${TOOLCHAIN_DIR}/gcc-14.3/bin/aarch64-none-linux-gnu-gcc" ]; then

            echo "[+] Downloading ARM GCC 14.3..."

            wget \
              --progress=dot:giga \
              --retry-connrefused \
              --tries=5 \
              --timeout=30 \
              "https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-aarch64-none-linux-gnu.tar.xz" \
              -O /tmp/gcc-14.3.tar.xz

            tar \
              -xf /tmp/gcc-14.3.tar.xz \
              -C "${TOOLCHAIN_DIR}/gcc-14.3" \
              --strip-components=1

            rm -f /tmp/gcc-14.3.tar.xz

          else

            echo "[=] GCC 14.3 already cached."

          fi

          # ======================================================
          # VERIFY
          # ======================================================

          echo ""
          echo "=========================================="
          echo "TOOLCHAIN CHECK"
          echo "=========================================="

          echo ""
          echo "Clang:"
          "${TOOLCHAIN_DIR}/clang-r383902b/bin/clang" \
            --version | head -n 3

          echo ""
          echo "AArch64 GCC:"
          "${TOOLCHAIN_DIR}/gcc-14.3/bin/aarch64-none-linux-gnu-gcc" \
            --version | head -n 3

          echo ""
          echo "LLVM LD:"
          "${TOOLCHAIN_DIR}/clang-r383902b/bin/ld.lld" \
            --version | head -n 2

      # ==========================================================
      # EXPORT TOOLCHAIN PATH
      # ==========================================================

      - name: Setup Toolchain Environment
        shell: bash
        run: |
          set -e

          TOOLCHAIN_DIR="${GITHUB_WORKSPACE}/toolchain_download"

          echo "${TOOLCHAIN_DIR}/clang-r383902b/bin" >> "$GITHUB_PATH"
          echo "${TOOLCHAIN_DIR}/gcc-14.3/bin" >> "$GITHUB_PATH"

          echo "ARCH=arm64" >> "$GITHUB_ENV"
          echo "SUBARCH=arm64" >> "$GITHUB_ENV"

          echo "CC=clang" >> "$GITHUB_ENV"
          echo "LD=ld.lld" >> "$GITHUB_ENV"
          echo "AR=llvm-ar" >> "$GITHUB_ENV"
          echo "NM=llvm-nm" >> "$GITHUB_ENV"

          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> "$GITHUB_ENV"

          echo "BSP_BUILD_FAMILY=sharkl3" >> "$GITHUB_ENV"
          echo "BSP_BUILD_ANDROID_OS=y" >> "$GITHUB_ENV"

          echo "CROSS_COMPILE=${TOOLCHAIN_DIR}/gcc-14.3/bin/aarch64-none-linux-gnu-" >> "$GITHUB_ENV"

          echo "CROSS_COMPILE_ARM32=${TOOLCHAIN_DIR}/gcc-14.3/bin/arm-none-linux-gnueabihf-" >> "$GITHUB_ENV"

          echo ""
          echo "===== ENVIRONMENT ====="

          echo "ARCH=arm64"
          echo "SUBARCH=arm64"
          echo "CC=clang"
          echo "LD=ld.lld"
          echo "CLANG_TRIPLE=aarch64-linux-gnu-"
          echo "BSP_BUILD_FAMILY=sharkl3"
          echo "BSP_BUILD_ANDROID_OS=y"

      # ==========================================================
      # CHECK SOURCE
      # ==========================================================

      - name: Check Kernel Source
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "KERNEL SOURCE"
          echo "=========================================="

          echo ""
          echo "Repository:"
          git remote -v || true

          echo ""
          echo "Commit:"
          git rev-parse HEAD

          echo ""
          echo "Kernel version:"

          grep -E \
            '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)[[:space:]]*=' \
            Makefile

          echo ""
          echo "Defconfig:"
          test -f arch/arm64/configs/a3core_eur_open_defconfig

          echo "[OK] Kernel source looks valid."

      # ==========================================================
      # PRE-BUILD KSU CHECK
      # ==========================================================

      - name: Check Existing KernelSU
        shell: bash
        run: |
          echo "=========================================="
          echo "EXISTING KERNELSU CHECK"
          echo "=========================================="

          if [ -d KernelSU ]; then
            echo "[!] Existing KernelSU directory found."
            ls -la KernelSU | head -n 30
          else
            echo "[=] No KernelSU directory yet."
          fi

          echo ""
          echo "drivers/kernelsu:"

          if [ -e drivers/kernelsu ]; then
            ls -la drivers/kernelsu
          else
            echo "[=] drivers/kernelsu does not currently exist."
          fi

      # ==========================================================
      # BUILD KERNEL
      # ==========================================================

      - name: Build Kernel With KernelSU v3.3.0-30
        shell: bash
        run: |
          set -e

          chmod +x b.sh

          echo ""
          echo "=========================================="
          echo "STARTING KERNEL BUILD"
          echo "=========================================="

          ./b.sh

      # ==========================================================
      # VERIFY BUILD
      # ==========================================================

      - name: Verify Build Result
        if: always()
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "BUILD RESULT"
          echo "=========================================="

          if [ -f "out/arch/arm64/boot/Image" ]; then
            echo "[OK] Kernel Image exists."

            ls -lh \
              "out/arch/arm64/boot/Image"

          else
            echo "[!] Kernel Image was not generated."
          fi

          echo ""
          echo "=========================================="
          echo "KERNELSU VERIFICATION"
          echo "=========================================="

          if [ -d "KernelSU" ]; then

            cd KernelSU

            echo ""
            echo "KernelSU tag:"
            git describe --tags --always || true

            echo ""
            echo "KernelSU commit:"
            git rev-parse HEAD || true

            echo ""
            echo "KernelSU latest commit:"
            git log -1 --oneline || true

            cd ..

          else

            echo "[!] KernelSU directory not found."

          fi

          echo ""
          echo "=========================================="
          echo "UAPI VERIFICATION"
          echo "=========================================="

          if [ -f "KernelSU/uapi/supercall.h" ]; then

            grep -n \
              "KERNEL_SU_UAPI_VERSION" \
              KernelSU/uapi/supercall.h || true

          else

            echo "[!] supercall.h not found."

          fi

          echo ""
          echo "=========================================="
          echo "KERNEL CONFIG"
          echo "=========================================="

          if [ -f "out/.config" ]; then

            grep -n \
              "^CONFIG_KSU" \
              out/.config || true

          else

            echo "[!] out/.config not found."

          fi

      # ==========================================================
      # SHOW ARTIFACTS
      # ==========================================================

      - name: List Output Artifacts
        if: always()
        shell: bash
        run: |
          echo "=========================================="
          echo "OUTPUT ARTIFACTS"
          echo "=========================================="

          if [ -d "output_artifacts" ]; then

            find output_artifacts \
              -type f \
              -exec ls -lh {} \;

          else

            echo "[!] output_artifacts directory does not exist."

          fi

      # ==========================================================
      # UPLOAD KERNEL ARTIFACT
      # ==========================================================

      - name: Upload Kernel Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-v3.3.0-30-Sprd
          path: |
            ${{ github.workspace }}/output_artifacts/**
          if-no-files-found: warn
          compression-level: 6
          retention-days: 7

      # ==========================================================
      # UPLOAD RAW BUILD OUTPUT
      # ==========================================================

      - name: Upload Build Diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-v3.3.0-30-Build-Diagnostics
          path: |
            ${{ github.workspace }}/out/.config
            ${{ github.workspace }}/out/System.map
            ${{ github.workspace }}/out/Module.symvers
            ${{ github.workspace }}/out/.version
          if-no-files-found: ignore
          compression-level: 6
          retention-days: 7
