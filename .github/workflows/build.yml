name: Build Kernel - Backslash KernelSU v3.3.0-39

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel-build:
    name: Build ARM64 Kernel
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64

      BSP_BUILD_FAMILY: sharkl3
      BSP_BUILD_ANDROID_OS: y

      DEFCONFIG: a3core_eur_open_defconfig

      KSU_VERSION: v3.3.0-39

      TOOLCHAIN_DIR: ${{ github.workspace }}/toolchain_download
      CLANG_DIR: ${{ github.workspace }}/toolchain_download/clang-r383902b
      GCC_DIR: ${{ github.workspace }}/toolchain_download/gcc-14.3

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      # =========================================================
      # SYSTEM INFO
      # =========================================================

      - name: System Information
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "SYSTEM INFORMATION"
          echo "=================================================="

          echo ""
          echo "OS:"
          cat /etc/os-release

          echo ""
          echo "CPU:"
          nproc

          echo ""
          echo "Memory:"
          free -h

          echo ""
          echo "Disk:"
          df -h .

      # =========================================================
      # DEPENDENCIES
      # =========================================================

      - name: Install Build Dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libyaml-dev \
            libncurses-dev \
            pkg-config \
            device-tree-compiler \
            libc++-dev \
            libc++abi-dev \
            python3 \
            python3-minimal \
            python-is-python3 \
            git \
            zip \
            unzip \
            curl \
            wget \
            cpio \
            tar \
            gzip \
            xz-utils \
            rsync \
            file \
            ca-certificates \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            ccache

          echo ""
          echo "=================================================="
          echo "DEPENDENCIES INSTALLED"
          echo "=================================================="

          echo ""
          echo "System GCC:"
          gcc --version

          echo ""
          echo "System Clang:"
          clang --version

          echo ""
          echo "System Make:"
          make --version

          echo ""
          echo "System Git:"
          git --version

      # =========================================================
      # LIBYAML
      # =========================================================

      - name: Verify LibYAML
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "LIBYAML CHECK"
          echo "=================================================="

          pkg-config --cflags yaml-0.1
          pkg-config --libs yaml-0.1

          cat > /tmp/test_yaml.c <<'EOF'
          #include <yaml.h>

          int main(void)
          {
              yaml_emitter_t emitter;

              if (!yaml_emitter_initialize(&emitter))
                  return 1;

              yaml_emitter_delete(&emitter);

              return 0;
          }
          EOF

          gcc \
            /tmp/test_yaml.c \
            -lyaml \
            -o /tmp/test_yaml

          /tmp/test_yaml

          rm -f /tmp/test_yaml.c
          rm -f /tmp/test_yaml

          echo "[OK] LibYAML works."

      # =========================================================
      # CACHE TOOLCHAIN
      # =========================================================

      - name: Restore Toolchain Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/toolchain_download
          key: kernel-toolchain-clang-r383902b-gcc14-v5
          restore-keys: |
            kernel-toolchain-

      # =========================================================
      # DOWNLOAD TOOLCHAIN
      # =========================================================

      - name: Setup Toolchains
        shell: bash
        run: |
          set -e

          mkdir -p "${CLANG_DIR}"
          mkdir -p "${GCC_DIR}"

          # =====================================================
          # CLANG R383902B
          # =====================================================

          if [ ! -x "${CLANG_DIR}/bin/clang" ]; then

            echo "=================================================="
            echo "DOWNLOADING CLANG R383902B"
            echo "=================================================="

            rm -rf "${CLANG_DIR}"

            mkdir -p "${CLANG_DIR}"

            wget \
              --retry-connrefused \
              --tries=5 \
              --timeout=60 \
              --progress=dot:giga \
              "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/0e9e7035bf8ad42437c6156e5950eab13655b26c/clang-r383902b.tar.gz" \
              -O /tmp/clang-r383902b.tar.gz

            tar \
              -xzf /tmp/clang-r383902b.tar.gz \
              -C "${CLANG_DIR}"

            rm -f /tmp/clang-r383902b.tar.gz

          else

            echo "[OK] Clang r383902b already cached."

          fi

          # =====================================================
          # GCC 14.3
          # =====================================================

          if [ ! -x "${GCC_DIR}/bin/aarch64-none-linux-gnu-gcc" ]; then

            echo "=================================================="
            echo "DOWNLOADING ARM GCC 14.3"
            echo "=================================================="

            rm -rf "${GCC_DIR}"

            mkdir -p "${GCC_DIR}"

            wget \
              --retry-connrefused \
              --tries=5 \
              --timeout=60 \
              --progress=dot:giga \
              "https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-aarch64-none-linux-gnu.tar.xz" \
              -O /tmp/gcc-14.3.tar.xz

            tar \
              -xJf /tmp/gcc-14.3.tar.xz \
              -C "${GCC_DIR}" \
              --strip-components=1

            rm -f /tmp/gcc-14.3.tar.xz

          else

            echo "[OK] GCC 14.3 already cached."

          fi

      # =========================================================
      # TOOLCHAIN PATH
      # =========================================================

      - name: Configure Toolchain
        shell: bash
        run: |
          set -e

          CLANG_BIN="${CLANG_DIR}/bin"
          GCC_BIN="${GCC_DIR}/bin"

          echo "=================================================="
          echo "CONFIGURING TOOLCHAIN"
          echo "=================================================="

          export PATH="${CLANG_BIN}:${GCC_BIN}:${PATH}"

          echo "PATH=${PATH}" >> "${GITHUB_ENV}"

          echo "ARCH=arm64" >> "${GITHUB_ENV}"
          echo "SUBARCH=arm64" >> "${GITHUB_ENV}"

          echo "CC=clang" >> "${GITHUB_ENV}"
          echo "LD=ld.lld" >> "${GITHUB_ENV}"
          echo "AR=llvm-ar" >> "${GITHUB_ENV}"
          echo "NM=llvm-nm" >> "${GITHUB_ENV}"

          echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> "${GITHUB_ENV}"

          echo "CROSS_COMPILE=${GCC_BIN}/aarch64-none-linux-gnu-" >> "${GITHUB_ENV}"

          if [ -x "${GCC_BIN}/arm-none-linux-gnueabihf-gcc" ]; then
            echo "CROSS_COMPILE_ARM32=${GCC_BIN}/arm-none-linux-gnueabihf-" >> "${GITHUB_ENV}"
          else
            echo "CROSS_COMPILE_ARM32=arm-linux-gnueabihf-" >> "${GITHUB_ENV}"
          fi

          echo "BSP_BUILD_FAMILY=sharkl3" >> "${GITHUB_ENV}"
          echo "BSP_BUILD_ANDROID_OS=y" >> "${GITHUB_ENV}"

          echo ""
          echo "CLANG_BIN=${CLANG_BIN}"
          echo "GCC_BIN=${GCC_BIN}"

          echo ""
          echo "PATH:"
          printf '%s\n' "${PATH}"

      # =========================================================
      # VERIFY TOOLCHAIN
      # =========================================================

      - name: Verify Selected Toolchain
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "VERIFYING SELECTED TOOLCHAIN"
          echo "=================================================="

          echo ""
          echo "clang:"
          command -v clang
          clang --version

          echo ""
          echo "ld.lld:"
          command -v ld.lld
          ld.lld --version

          echo ""
          echo "llvm-ar:"
          command -v llvm-ar
          llvm-ar --version

          echo ""
          echo "llvm-nm:"
          command -v llvm-nm
          llvm-nm --version

          echo ""
          echo "AArch64 GCC:"
          command -v aarch64-none-linux-gnu-gcc
          aarch64-none-linux-gnu-gcc --version

          echo ""
          echo "=================================================="
          echo "[OK] TOOLCHAIN IS READY"
          echo "=================================================="

      # =========================================================
      # SOURCE CHECK
      # =========================================================

      - name: Verify Kernel Source
        shell: bash
        run: |
          set -e

          echo "=================================================="
          echo "KERNEL SOURCE CHECK"
          echo "=================================================="

          echo ""
          echo "Commit:"
          git rev-parse HEAD

          echo ""
          echo "Kernel version:"

          grep -E \
            '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)[[:space:]]*=' \
            Makefile

          echo ""
          echo "Defconfig:"

          test -f \
            "arch/arm64/configs/${DEFCONFIG}"

          echo "${DEFCONFIG}"

          echo ""
          echo "[OK] Kernel source verified."

      # =========================================================
      # BUILD
      # =========================================================

      - name: Build Kernel
        shell: bash
        run: |
          set -e

          chmod +x b.sh

          echo "=================================================="
          echo "STARTING KERNEL BUILD"
          echo "=================================================="

          ./b.sh

      # =========================================================
      # VERIFY KSU
      # =========================================================

      - name: Verify KernelSU
        if: always()
        shell: bash
        run: |
          echo "=================================================="
          echo "KERNELSU VERIFICATION"
          echo "=================================================="

          if [ -d "KernelSU" ]; then

            cd KernelSU

            echo ""
            echo "Remote:"
            git remote -v || true

            echo ""
            echo "Commit:"
            git rev-parse HEAD || true

            echo ""
            echo "Tag:"
            git describe --tags --always || true

            echo ""
            echo "Exact tag:"
            git describe --tags --exact-match 2>/dev/null || true

            cd ..

          else

            echo "[!] KernelSU directory not found."

          fi

          echo ""
          echo "Expected:"
          echo "${KSU_VERSION}"

          echo ""
          echo "UAPI:"

          if [ -f "KernelSU/uapi/supercall.h" ]; then

            grep \
              -n \
              "KERNEL_SU_UAPI_VERSION" \
              KernelSU/uapi/supercall.h || true

          else

            echo "UAPI header not found."

          fi

          echo ""
          echo "Kernel config:"

          if [ -f "out/.config" ]; then

            grep \
              -n \
              "^CONFIG_KSU" \
              out/.config || true

          else

            echo "out/.config not found."

          fi

      # =========================================================
      # IMAGE CHECK
      # =========================================================

      - name: Verify Kernel Image
        if: always()
        shell: bash
        run: |
          echo "=================================================="
          echo "KERNEL IMAGE"
          echo "=================================================="

          IMAGE="${GITHUB_WORKSPACE}/out/arch/arm64/boot/Image"

          if [ -f "${IMAGE}" ]; then

            echo "[OK] Image exists."

            ls -lh "${IMAGE}"

            echo ""
            echo "File type:"
            file "${IMAGE}"

            echo ""
            echo "SHA256:"
            sha256sum "${IMAGE}"

          else

            echo "[!] Image does not exist."

          fi

      # =========================================================
      # MODULE CHECK
      # =========================================================

      - name: Verify Kernel Modules
        if: always()
        shell: bash
        run: |
          echo "=================================================="
          echo "KERNEL MODULES"
          echo "=================================================="

          if [ -d "out" ]; then

            COUNT="$(
              find out \
                -type f \
                -name "*.ko" \
                | wc -l
            )"

            echo "Module count: ${COUNT}"

          else

            echo "out directory does not exist."

          fi

      # =========================================================
      # DTB CHECK
      # =========================================================

      - name: Verify DTBs
        if: always()
        shell: bash
        run: |
          echo "=================================================="
          echo "DTB / DTBO"
          echo "=================================================="

          DTB_DIR="out/arch/arm64/boot/dts"

          if [ -d "${DTB_DIR}" ]; then

            COUNT="$(
              find "${DTB_DIR}" \
                -type f \
                \( \
                  -name "*.dtb" \
                  -o \
                  -name "*.dtbo" \
                \) \
                | wc -l
            )"

            echo "DTB/DTBO count: ${COUNT}"

          else

            echo "DTB directory does not exist."

          fi

      # =========================================================
      # ARTIFACT LIST
      # =========================================================

      - name: List Artifacts
        if: always()
        shell: bash
        run: |
          echo "=================================================="
          echo "OUTPUT ARTIFACTS"
          echo "=================================================="

          if [ -d "output_artifacts" ]; then

            find output_artifacts \
              -type f \
              -exec ls -lh {} \;

          else

            echo "output_artifacts directory does not exist."

          fi

      # =========================================================
      # UPLOAD SUCCESS ARTIFACT
      # =========================================================

      - name: Upload Kernel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-v3.3.0-39-Sprd
          path: |
            ${{ github.workspace }}/output_artifacts/**
          if-no-files-found: error
          compression-level: 6
          retention-days: 7

      # =========================================================
      # UPLOAD DEBUG
      # =========================================================

      - name: Upload Debug Output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Build-Debug
          path: |
            ${{ github.workspace }}/out/.config
            ${{ github.workspace }}/out/Module.symvers
            ${{ github.workspace }}/out/System.map
            ${{ github.workspace }}/output_artifacts/**
          if-no-files-found: ignore
          compression-level: 6
          retention-days: 7
